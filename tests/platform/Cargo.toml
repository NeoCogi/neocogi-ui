[package]
name = "neocogi-ui-platform-tests"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[features]
default = ["glow"]
glow = ["neocogi-platform/glow"]
vulkan = ["neocogi-platform/vulkan"]
wgpu = ["neocogi-platform/wgpu"]
webgl = ["neocogi-platform/webgl"]

[dev-dependencies]
neocogi-platform-contracts.workspace = true
neocogi-platform = { workspace = true, features = ["platform", "test-support"] }
neocogi-ui.workspace = true
neocogi-ui-runtime.workspace = true
neocogi-ui-nodes.workspace = true
neocogi-gfx = { workspace = true, features = ["builder"] }
neocogi-gfx-support.workspace = true
neocogi-demo-assets = { workspace = true, features = ["embed-assets"] }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.77"
web-sys = { workspace = true, features = ["Window", "Document", "HtmlCanvasElement", "HtmlTextAreaElement", "CssStyleDeclaration", "Element", "EventTarget", "KeyboardEvent", "CompositionEvent", "FocusEvent"] }
