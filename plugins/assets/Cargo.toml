[package]
name = "microui-plugin-assets"
version = "0.9.0-alpha.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
builder = ["dep:fontdue"]
theme-json = ["builder", "microui-contracts/theme-json", "dep:serde", "dep:serde_json"]
dynamic-plugin = []

[dependencies]
microui-contracts.workspace = true
microui-redux.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
png.workspace = true
fontdue = { workspace = true, optional = true }
nc-com = { workspace = true, features = ["macros", "std"] }

[dev-dependencies]
microui-ui = { workspace = true, features = ["builder"] }
microui-redux-demo-assets = { workspace = true, features = ["builder", "embed-assets"] }
