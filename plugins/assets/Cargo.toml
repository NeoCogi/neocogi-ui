[package]
name = "microui-plugin-assets"
version = "0.9.0-alpha.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
builder = ["dep:fontdue"]
theme-json = ["builder", "microui-contracts/theme-json", "dep:serde", "dep:serde_json"]
save-to-rust = ["dep:tempfile", "dep:miniz_oxide"]
dynamic-plugin = []

[dependencies]
tempfile = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }
microui-contracts.workspace = true
microui-redux.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
png.workspace = true
fontdue = { workspace = true, optional = true }
neocogi-com = { workspace = true, features = ["macros", "std"] }

[dev-dependencies]
microui-ui.workspace = true
