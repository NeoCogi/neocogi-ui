[package]
name = "neocogi-ui-package-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
neocogi-com = { version = "=0.1.0", default-features = false, features = ["std", "macros", "runtime"] }
neocogi-com-host = "=0.1.0"
neocogi-ui-contracts = { version = "=0.2.0-alpha.1", default-features = false, features = ["test-support"] }
neocogi-ui = { version = "=0.2.0-alpha.1", default-features = false, features = ["gfx", "skin", "test-support", "ui"] }

[build-dependencies]
neocogi-ui-contracts = { version = "=0.2.0-alpha.1", default-features = false, features = ["build-support"] }
