assets = [{ from = "assets", to = "assets" }, { from = "tools/ui-designer/examples", to = "examples/ui" }]

[workspace.metadata.neocogi.assemblies.ui-designer.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
