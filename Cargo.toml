[workspace]
resolver = "3"
members = [
    "crates/ui/core-contracts",
    "crates/ui/nodes-contracts",
    "crates/ui/document-contracts",
    "crates/ui/design",
    "crates/ui/document",
    "crates/gfx/contracts",
    "crates/gfx/support",
    "crates/gfx/impl",
    "crates/gfx/plugin",
    "crates/skin/contracts",
    "crates/appearance",
    "crates/skin/authoring",
    "crates/skin/impl",
    "crates/skin/plugin",
    "examples/ui-extension",
    "examples/runtime-ui",
    "crates/ui/api",
    "crates/ui/runtime",
    "crates/ui/support",
    "crates/ui/nodes",
    "demos/assets",
    "demos/host",
    "demos/plugins",
    "demos/contracts",
    "demos/full",
    "demos/ui-samples",
    "demos/basic",
    "demos/smoke",
    "tools/assets",
]
default-members = ["crates/ui/api"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-ui"

[workspace.dependencies]
neocogi-ui-samples = { path = "demos/ui-samples" }
neocogi-ui-core-contracts = { path = "crates/ui/core-contracts" }
neocogi-ui-nodes-contracts = { path = "crates/ui/nodes-contracts" }
neocogi-ui-document-contracts = { path = "crates/ui/document-contracts" }
neocogi-ui-design = { path = "crates/ui/design" }
neocogi-ui-document = { path = "crates/ui/document" }
neocogi-renderer-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-platform-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-gfx-contracts = { path = "crates/gfx/contracts" }
neocogi-gfx-support = { path = "crates/gfx/support" }
neocogi-gfx-impl = { path = "crates/gfx/impl", version = "0.0.0", default-features = false }
neocogi-gfx = { path = "crates/gfx/plugin", default-features = false }
neocogi-skin-contracts = { path = "crates/skin/contracts" }
neocogi-appearance = { path = "crates/appearance", version = "0.0.0" }
neocogi-skin-authoring = { path = "crates/skin/authoring", default-features = false }
neocogi-skin-impl = { path = "crates/skin/impl", version = "0.0.0", default-features = false }
neocogi-skin = { path = "crates/skin/plugin", default-features = false }
neocogi-com-core = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0", default-features = false }
neocogi-com-codegen = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0", default-features = false }
neocogi-com-macros = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0", default-features = false }
neocogi-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0", default-features = false }
neocogi-com-runtime = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0", default-features = false }
neocogi-native-runtime-link = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db" }
neocogi-native-layout = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-idl = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "4efcd673012ccf2d43220174598738703486b1db", version = "0.0.0" }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-ui = { path = "crates/ui/api", version = "0.0.0", default-features = false }
neocogi-ui-support = { path = "crates/ui/support", version = "0.0.0", default-features = false }
neocogi-ui-runtime = { path = "crates/ui/runtime", version = "0.0.0", default-features = false }
neocogi-ui-nodes = { path = "crates/ui/nodes", version = "0.0.0", default-features = false }
neocogi-demo-assets = { path = "demos/assets", default-features = false }
neocogi-demo-host = { path = "demos/host", default-features = false }
neocogi-demo-contracts = { path = "demos/contracts" }
neocogi-render-mesh-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-mesh = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3", default-features = false }
neocogi-render-core = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-support = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-glow = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-webgl = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-vulkan = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }
neocogi-render-wgpu = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d0d00596f221e062af3023e281f54bf2b623dec3" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
# Compile fixtures must remain runnable on the COM crates' Rust 1.85 floor.
trybuild = "=1.0.116"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
