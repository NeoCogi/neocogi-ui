assets = [{ from = "assets", to = "assets" }, { from = "themes", to = "themes" }]

[workspace.metadata.neocogi.assemblies.runtime-ui.variants.embedded]
add-application-features = ["embed-assets"]
assets = []

[workspace.metadata.neocogi.assemblies.ui-designer]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-ui-designer", bin = "neocogi-ui-designer", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
