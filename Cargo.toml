[workspace]
resolver = "3"
members = ["crates/ui/contracts", "plugins/extension-example", "plugins/assets", "plugins/platform", "plugins/renderer-support", "plugins/renderer-glow", "plugins/renderer-webgl-canvas", "plugins/renderer-vulkan", "plugins/renderer-wgpu", "crates/ui/api", "crates/ui/runtime", "demos/demo-assets", "demos/demo-host", "demos/demo-renderer", "demos/demo-contracts", "demos/demo-full", "demos/basic"]
default-members = ["crates/ui/api"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-platform"

[workspace.dependencies]
neocogi-ui-contracts = { path = "crates/ui/contracts" }
neocogi-com-core = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "66c1bc0be86b96e6f3f66bd0229834443623a9e5", version = "0.1.0", default-features = false }
neocogi-com-macros = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "66c1bc0be86b96e6f3f66bd0229834443623a9e5", version = "0.1.0", default-features = false }
neocogi-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "66c1bc0be86b96e6f3f66bd0229834443623a9e5", version = "0.1.0", default-features = false }
neocogi-com-runtime-sys = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "66c1bc0be86b96e6f3f66bd0229834443623a9e5", version = "0.1.0", default-features = false }
neocogi-com-runtime = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "66c1bc0be86b96e6f3f66bd0229834443623a9e5", version = "0.1.0", default-features = false }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-ui = { path = "crates/ui/api", version = "0.9.0-alpha.0", default-features = false }
microui-plugin-assets = { path = "plugins/assets", version = "0.9.0-alpha.0", default-features = false }
neocogi-ui-runtime = { path = "crates/ui/runtime", version = "0.9.0-alpha.0", default-features = false }
neocogi-ui-demo-assets = { path = "demos/demo-assets", default-features = false }
neocogi-ui-demo-host = { path = "demos/demo-host", default-features = false }
microui-demo-contracts = { path = "demos/demo-contracts" }
neocogi-ui-demo-renderer = { path = "demos/demo-renderer", default-features = false }
neocogi-ui-renderer-support = { path = "plugins/renderer-support" }
neocogi-ui-renderer-glow = { path = "plugins/renderer-glow" }
neocogi-ui-renderer-webgl-canvas = { path = "plugins/renderer-webgl-canvas" }
neocogi-ui-renderer-vulkan = { path = "plugins/renderer-vulkan" }
neocogi-ui-renderer-wgpu = { path = "plugins/renderer-wgpu" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false

# Native assemblies consumed by the installed cargo-neocogi command.
[workspace.metadata.neocogi]
default-assembly = "full"

[workspace.metadata.neocogi.assemblies.full]
application = { package = "neocogi-ui-demo-full", bin = "neocogi-ui-demo-full", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "microui-plugin-platform", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "microui-plugin-assets", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
    { from = "demos/demo-full/assets/FACEPALM.png", to = "assets/FACEPALM.png" },
]

[workspace.metadata.neocogi.assemblies.full.variants.glow]
application-features = ["glow"]
component-features.microui-plugin-platform = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.assemblies.full.variants.vulkan]
application-features = ["vulkan"]
component-features.microui-plugin-platform = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.full.variants.wgpu]
application-features = ["wgpu"]
component-features.microui-plugin-platform = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.full.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.microui-plugin-assets = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.simple]
application = { package = "neocogi-ui-basic-demos", bin = "simple", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "microui-plugin-platform", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "microui-plugin-assets", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
]

[workspace.metadata.neocogi.assemblies.simple.variants.glow]
application-features = ["glow"]
component-features.microui-plugin-platform = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.assemblies.simple.variants.vulkan]
application-features = ["vulkan"]
component-features.microui-plugin-platform = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.simple.variants.wgpu]
application-features = ["wgpu"]
component-features.microui-plugin-platform = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.simple.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
omit-plugins = ["microui-plugin-assets"]

[workspace.metadata.neocogi.assemblies.calculator]
