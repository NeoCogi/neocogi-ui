[workspace]
resolver = "3"
members = ["crates/microui-contracts", "plugins/ui", "plugins/assets", "plugins/platform", "crates/microui-redux", "crates/microui-ui", "crates/renderer-support", "crates/renderer-glow", "crates/renderer-webgl-canvas", "crates/renderer-vulkan", "crates/renderer-wgpu", "demos/demo-assets", "demos/demo-host", "demos/demo-renderer", "demos/demo-contracts", "demos/demo-full", "demos/basic"]
default-members = ["crates/microui-redux"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/microui-redux"

[workspace.dependencies]
microui-contracts = { path = "crates/microui-contracts" }
nc-com-core = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "f151ebddfe9866575f4cd55cc0ca5d0df8491f9f", version = "0.1.0", default-features = false }
nc-com-macros = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "f151ebddfe9866575f4cd55cc0ca5d0df8491f9f", version = "0.1.0", default-features = false }
nc-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "f151ebddfe9866575f4cd55cc0ca5d0df8491f9f", version = "0.1.0", default-features = false }
nc-com-runtime-sys = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "f151ebddfe9866575f4cd55cc0ca5d0df8491f9f", version = "0.1.0", default-features = false }
nc-com-runtime = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "f151ebddfe9866575f4cd55cc0ca5d0df8491f9f", version = "0.1.0", default-features = false }
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
microui-redux = { path = "crates/microui-redux", version = "0.9.0-alpha.0", default-features = false }
microui-ui = { path = "crates/microui-ui", version = "0.9.0-alpha.0", default-features = false }
microui-redux-demo-assets = { path = "demos/demo-assets", default-features = false }
microui-redux-demo-host = { path = "demos/demo-host", default-features = false }
microui-demo-contracts = { path = "demos/demo-contracts" }
microui-redux-demo-renderer = { path = "demos/demo-renderer", default-features = false }
microui-redux-renderer-support = { path = "crates/renderer-support" }
microui-redux-renderer-glow = { path = "crates/renderer-glow" }
microui-redux-renderer-webgl-canvas = { path = "crates/renderer-webgl-canvas" }
microui-redux-renderer-vulkan = { path = "crates/renderer-vulkan" }
microui-redux-renderer-wgpu = { path = "crates/renderer-wgpu" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
