[workspace]
resolver = "3"
members = [
    "crates/ui/contracts",
    "examples/ui-extension",
    "crates/assets",
    "crates/ui/api",
    "crates/ui/runtime",
    "demos/assets",
    "demos/host",
    "demos/contracts",
    "demos/full",
    "demos/basic",
    "demos/smoke",
    "tools/assets",
]
default-members = ["crates/ui/api"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-platform"

[workspace.dependencies]
neocogi-ui-contracts = { path = "crates/ui/contracts" }
neocogi-com-core = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "80ecac94b9f166af034be2251b275c51b5c26fdc", version = "0.1.0", default-features = false }
neocogi-com-macros = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "80ecac94b9f166af034be2251b275c51b5c26fdc", version = "0.1.0", default-features = false }
neocogi-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "80ecac94b9f166af034be2251b275c51b5c26fdc", version = "0.1.0", default-features = false }
neocogi-com-runtime-sys = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "80ecac94b9f166af034be2251b275c51b5c26fdc", version = "0.1.0", default-features = false }
neocogi-com-runtime = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "80ecac94b9f166af034be2251b275c51b5c26fdc", version = "0.1.0", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-ui = { path = "crates/ui/api", version = "0.9.0-alpha.0", default-features = false }
neocogi-assets = { path = "crates/assets", version = "0.9.0-alpha.0", default-features = false }
neocogi-ui-runtime = { path = "crates/ui/runtime", version = "0.9.0-alpha.0", default-features = false }
neocogi-demo-assets = { path = "demos/assets", default-features = false }
neocogi-demo-host = { path = "demos/host", default-features = false }
neocogi-demo-contracts = { path = "demos/contracts" }
neocogi-demo-renderer = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b", default-features = false }
neocogi-render-core = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }
neocogi-render-support = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }
neocogi-render-glow = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }
neocogi-render-webgl = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }
neocogi-render-vulkan = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }
neocogi-render-wgpu = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "94679399c79ec659e50c976af0f989d30a49f25b" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false

# Native assemblies consumed by the installed cargo-neocogi command.
[workspace.metadata.neocogi]
default-assembly = "full"

[workspace.metadata.neocogi.assemblies.full]
application = { package = "neocogi-demo-full", bin = "neocogi-demo-full", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-assets", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
    { from = "demos/full/assets/FACEPALM.png", to = "assets/FACEPALM.png" },
]

[workspace.metadata.neocogi.assemblies.full.variants.glow]
application-features = ["glow"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.assemblies.full.variants.vulkan]
application-features = ["vulkan"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.full.variants.wgpu]
application-features = ["wgpu"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.full.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-assets = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.simple]
application = { package = "neocogi-demo-basic", bin = "simple", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-assets", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
]

[workspace.metadata.neocogi.assemblies.simple.variants.glow]
application-features = ["glow"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.assemblies.simple.variants.vulkan]
application-features = ["vulkan"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.simple.variants.wgpu]
application-features = ["wgpu"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.simple.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
omit-plugins = ["neocogi-assets"]

[workspace.metadata.neocogi.assemblies.calculator]
