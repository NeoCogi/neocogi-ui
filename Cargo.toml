[workspace]
resolver = "3"
exclude = ["target", "tmp"]
members = [
    "crates/ui/design",
    "crates/ui/document",
    "crates/gfx/support",
    "crates/gfx/impl",
    "crates/gfx/plugin",
    "crates/gfx/plugin/dylib",
    "crates/appearance",
    "crates/skin/authoring",
    "crates/skin/impl",
    "crates/skin/plugin",
    "crates/skin/plugin/dylib",
    "examples/ui-extension",
    "examples/ui-extension/dylib",
    "examples/runtime-ui",
    "crates/ui/api",
    "crates/ui/runtime",
    "crates/ui/runtime/dylib",
    "crates/ui/support",
    "crates/ui/nodes",
    "crates/ui/nodes/dylib",
    "examples/assets",
    "examples/host",
    "examples/plugins",
    "examples/full",
    "examples/ui-samples",
    "examples/basic",
    "examples/smoke",
    "tools/assets",
]
default-members = ["crates/ui/api"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-ui"

[workspace.dependencies]
neocogi-shader-core = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-shader-compiler = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef", default-features = false }
neocogi-ui-samples = { path = "examples/ui-samples" }
neocogi-ui-design = { path = "crates/ui/design" }
neocogi-ui-document = { path = "crates/ui/document" }
neocogi-gfx-support = { path = "crates/gfx/support" }
neocogi-gfx-impl = { path = "crates/gfx/impl", version = "0.0.0", default-features = false }
neocogi-gfx = { path = "crates/gfx/plugin", default-features = false }
neocogi-appearance = { path = "crates/appearance", version = "0.0.0" }
neocogi-skin-authoring = { path = "crates/skin/authoring", default-features = false }
neocogi-skin-impl = { path = "crates/skin/impl", version = "0.0.0", default-features = false }
neocogi-skin = { path = "crates/skin/plugin", default-features = false }
neocogi-com = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-com-host = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-native-layout = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-idl = { version = "=0.1.0-alpha.1" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-ui = { path = "crates/ui/api", version = "0.0.0", default-features = false }
neocogi-ui-support = { path = "crates/ui/support", version = "0.0.0", default-features = false }
neocogi-ui-runtime = { path = "crates/ui/runtime", version = "0.0.0", default-features = false }
neocogi-ui-nodes = { path = "crates/ui/nodes", version = "0.0.0", default-features = false }
neocogi-demo-assets = { path = "examples/assets", default-features = false }
neocogi-demo-host = { path = "examples/host", default-features = false }
neocogi-render-gpu = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-core = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-support = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-glow = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-webgl = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-vulkan = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }
neocogi-render-wgpu = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "be7373625f3600febacceb1beee67745bd6b47ef" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
# Keep UI compile-fixture diagnostics on the established trybuild release.
trybuild = "=1.0.116"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out", "spv-in", "spv-out"] }

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
