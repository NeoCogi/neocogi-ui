[workspace]
resolver = "3"
exclude = ["target", "tmp"]
members = [
    "crates/ui-contracts",
    "crates/ui",
    "crates/ui-dylib",
    "examples/ui-extension",
    "examples/ui-extension/dylib",
    "examples/runtime-ui",
    "examples/assets",
    "examples/host",
    "examples/plugins",
    "examples/full",
    "examples/ui-samples",
    "examples/basic",
    "examples/smoke",
    "tools/assets",
    "tools/native-artifacts",
    "tests/platform"
]
default-members = ["crates/ui"]

[workspace.package]
version = "0.2.0-alpha.1"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
repository = "https://github.com/NeoCogi/neocogi-ui"

[workspace.dependencies]
neocogi-ui-contracts = { path = "crates/ui-contracts", version = "=0.2.0-alpha.1", default-features = false }
neocogi-ui = { path = "crates/ui", version = "=0.2.0-alpha.1", default-features = false }
neocogi-platform-contracts = { version = "=0.2.0-alpha.2", default-features = false }
neocogi-platform = { version = "=0.2.0-alpha.2", default-features = false }
neocogi-ui-samples = { path = "examples/ui-samples", version = "=0.2.0-alpha.1" }
neocogi-com = { version = "=0.1.0", default-features = false }
neocogi-com-host = { version = "=0.1.0", default-features = false }
neocogi-idl = { version = "=0.1.0" }
neocogi-demo-assets = { path = "examples/assets", default-features = false, version = "=0.2.0-alpha.1" }
neocogi-demo-host = { path = "examples/host", default-features = false, version = "=0.2.0-alpha.1" }
bitflags = "2.4.1"
fontdue = "0.9.2"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
rs-math3d = "=0.21.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "=1.0.116"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
