[workspace]
resolver = "3"
members = [
    "crates/ui/core-contracts",
    "crates/ui/nodes-contracts",
    "crates/ui/document-contracts",
    "crates/ui/design",
    "crates/ui/document",
    "crates/gfx/contracts",
    "crates/gfx/support",
    "crates/gfx/impl",
    "crates/gfx/plugin",
    "crates/skin/contracts",
    "crates/appearance",
    "crates/skin/authoring",
    "crates/skin/impl",
    "crates/skin/plugin",
    "examples/ui-extension",
    "examples/runtime-ui",
    "crates/ui/api",
    "crates/ui/runtime",
    "crates/ui/support",
    "crates/ui/nodes",
    "demos/assets",
    "demos/host",
    "demos/contracts",
    "demos/full",
    "demos/ui-samples",
    "demos/basic",
    "demos/smoke",
    "tools/assets",
]
default-members = ["crates/ui/api"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-ui"

[workspace.dependencies]
neocogi-ui-samples = { path = "demos/ui-samples" }
neocogi-ui-core-contracts = { path = "crates/ui/core-contracts" }
neocogi-ui-nodes-contracts = { path = "crates/ui/nodes-contracts" }
neocogi-ui-document-contracts = { path = "crates/ui/document-contracts" }
neocogi-ui-design = { path = "crates/ui/design" }
neocogi-ui-document = { path = "crates/ui/document" }
neocogi-renderer-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-platform-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-gfx-contracts = { path = "crates/gfx/contracts" }
neocogi-gfx-support = { path = "crates/gfx/support" }
neocogi-gfx-impl = { path = "crates/gfx/impl", version = "0.0.0", default-features = false }
neocogi-gfx = { path = "crates/gfx/plugin", default-features = false }
neocogi-skin-contracts = { path = "crates/skin/contracts" }
neocogi-appearance = { path = "crates/appearance", version = "0.0.0" }
neocogi-skin-authoring = { path = "crates/skin/authoring", default-features = false }
neocogi-skin-impl = { path = "crates/skin/impl", version = "0.0.0", default-features = false }
neocogi-skin = { path = "crates/skin/plugin", default-features = false }
neocogi-com-core = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "752c66f3f00003f5cbc39f70a3d545a6d8f1cd68", version = "0.0.0", default-features = false }
neocogi-com-macros = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "752c66f3f00003f5cbc39f70a3d545a6d8f1cd68", version = "0.0.0", default-features = false }
neocogi-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "752c66f3f00003f5cbc39f70a3d545a6d8f1cd68", version = "0.0.0", default-features = false }
neocogi-com-runtime = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "752c66f3f00003f5cbc39f70a3d545a6d8f1cd68", version = "0.0.0", default-features = false }
neocogi-idl = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "752c66f3f00003f5cbc39f70a3d545a6d8f1cd68", version = "0.0.0" }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-ui = { path = "crates/ui/api", version = "0.0.0", default-features = false }
neocogi-ui-support = { path = "crates/ui/support", version = "0.0.0", default-features = false }
neocogi-ui-runtime = { path = "crates/ui/runtime", version = "0.0.0", default-features = false }
neocogi-ui-nodes = { path = "crates/ui/nodes", version = "0.0.0", default-features = false }
neocogi-demo-assets = { path = "demos/assets", default-features = false }
neocogi-demo-host = { path = "demos/host", default-features = false }
neocogi-demo-contracts = { path = "demos/contracts" }
neocogi-render-mesh-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-mesh = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742", default-features = false }
neocogi-render-core = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-support = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-glow = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-webgl = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-vulkan = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }
neocogi-render-wgpu = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "b2277f91d5beeca9c20aa13d523f332751b22742" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false

# Native assemblies consumed by the installed cargo-neocogi command.
[workspace.metadata.neocogi]
default-assembly = "full"


# Shared selectable policies; assemblies opt in explicitly and keep resource choices local.
[workspace.metadata.neocogi.variants.glow]
application-features = ["glow"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.variants.vulkan]
application-features = ["vulkan"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.variants.wgpu]
application-features = ["wgpu"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.variants.monolith]
linkage = "monolith"

[workspace.metadata.neocogi.assemblies.full]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-demo-full", bin = "neocogi-demo-full", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
    { package = "neocogi-skin", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
    { from = "demos/full/assets/FACEPALM.png", to = "assets/FACEPALM.png" },
]

[workspace.metadata.neocogi.assemblies.full.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-gfx = ["dynamic-plugin"]
component-features.neocogi-skin = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.simple]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-demo-basic", bin = "neocogi-demo-simple", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
]
assets = [
    { from = "assets", to = "assets" },
]

[workspace.metadata.neocogi.assemblies.simple.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-gfx = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.calculator]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-demo-basic", bin = "neocogi-demo-calculator", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
]
assets = [
    { from = "assets", to = "assets" },
]

[workspace.metadata.neocogi.assemblies.calculator.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-gfx = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.backend-frame-cube]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-demo-basic", bin = "neocogi-demo-cube", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
]
assets = [
    { from = "assets", to = "assets" },
]

[workspace.metadata.neocogi.assemblies.backend-frame-cube.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-gfx = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.smoke]
use-variants = ["glow", "vulkan", "wgpu", "monolith"]
application = { package = "neocogi-demo-smoke", bin = "neocogi-demo-smoke", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-ui-nodes", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-gfx", default-features = false, features = ["builder", "dynamic-plugin"] },
    { package = "neocogi-skin", default-features = false, features = ["dynamic-plugin", "theme-json"] },
