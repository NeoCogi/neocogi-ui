[package]
autobins = false
name = "neocogi-runtime-ui-example"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[features]
dynamic = ["neocogi-demo-host/dynamic"]
default = ["glow", "dynamic"]
glow = ["neocogi-demo-host/glow"]
vulkan = ["neocogi-demo-host/vulkan"]
wgpu = ["neocogi-demo-host/wgpu"]
webgl = ["neocogi-demo-host/webgl", "embed-assets"]
monolith = ["neocogi-demo-host/monolith-gfx"]
embed-assets = ["neocogi-demo-assets/embed-assets"]

[dependencies]
neocogi-com-host = { workspace = true }
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-demo-host = { workspace = true }
neocogi-demo-assets = { workspace = true }
neocogi-ui-contracts = { workspace = true }
neocogi-ui = { workspace = true, features = ["document"] }

[[bin]]
name = "neocogi-example-ui"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
neocogi-ui = { workspace = true, features = ["test-support", "ui"] }
