[package]
# Installed executable names are declared explicitly below.
autobins = false
name = "neocogi-demo-smoke"
default-run = "neocogi-demo-smoke"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
dynamic = ["neocogi-demo-host/dynamic-skin"]
default = ["glow", "dynamic"]
# Link the runtime and selected implementation descriptors into one executable.
monolith = ["neocogi-demo-host/monolith-gfx", "neocogi-demo-host/monolith-skin"]
glow = ["neocogi-demo-host/glow"]
vulkan = ["neocogi-demo-host/vulkan"]
wgpu = ["neocogi-demo-host/wgpu"]
extension = []
# Extension implementations follow the same explicit linkage choice as the host.
dynamic-extension = ["extension", "dynamic", "neocogi-demo-host/dynamic-extension"]
monolith-extension = ["extension", "monolith", "neocogi-demo-host/monolith-extension"]
# Standalone development benchmark; no counters or recorder enter the normal demo executable.
benchmark = ["embed-assets", "monolith", "dep:neocogi-ui-nodes", "dep:neocogi-gfx", "dep:neocogi-gfx-support"]
embed-assets = ["neocogi-demo-assets/embed-assets"]

[dependencies]
neocogi-gfx-support = { workspace = true, features = ["test-support"], optional = true }
neocogi-com-host.workspace = true
neocogi-demo-host.workspace = true
neocogi-ui-samples.workspace = true
neocogi-render-gpu.workspace = true
rs-math3d.workspace = true
neocogi-ui = { workspace = true, features = ["skin"] }
neocogi-com = { workspace = true, default-features = false, features = ["runtime", "macros", "std"] }

neocogi-demo-assets = { workspace = true, features = ["external-themes"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Dynamic assemblies select final DLL packages; monoliths call implementation descriptors directly.
neocogi-ui-nodes = { workspace = true, optional = true }
neocogi-gfx = { workspace = true, features = ["builder"], optional = true }

[[bin]]
name = "neocogi-com-bench"
path = "src/bin/com-bench.rs"
required-features = ["benchmark"]

[[bin]]
name = "neocogi-demo-smoke"
path = "src/main.rs"
