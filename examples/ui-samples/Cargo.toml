[package]
name = "neocogi-ui-samples"
version.workspace = true
publish = false
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "schemas/**"]
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Reusable NeoCogi sample widget contracts and event constructors"
repository.workspace = true

[dependencies]
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-ui-contracts = { workspace = true }

[build-dependencies]
neocogi-idl = { workspace = true }
neocogi-ui-contracts = { workspace = true, features = ["build-support"] }
