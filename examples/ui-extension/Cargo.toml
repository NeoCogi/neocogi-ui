[package]
name = "neocogi-example-ui-extension"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent NeoCogi leaf widget and container plugin example"
publish = false

[lib]
# Reusable implementation; the dylib subpackage alone owns the native loader export.
name = "nc_ui_extension"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
neocogi-ui-samples.workspace = true
neocogi-ui-design.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
