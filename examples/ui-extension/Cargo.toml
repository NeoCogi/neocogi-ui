[package]
name = "neocogi-example-ui-extension"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent NeoCogi leaf widget and container plugin example"
publish = false

[lib]
# The Rust target also defines the deployed shared-library name on each platform.
name = "nc_ui_extension"
crate-type = ["rlib", "cdylib"]

[features]
default = []
dynamic-plugin = ["dep:neocogi-native-runtime-link"]

[dependencies]
neocogi-ui-core-contracts.workspace = true
neocogi-demo-contracts.workspace = true
neocogi-ui-design.workspace = true
neocogi-ui-document-contracts.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
neocogi-native-runtime-link = { workspace = true, optional = true }
