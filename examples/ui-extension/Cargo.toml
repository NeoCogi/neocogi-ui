[package]
name = "neocogi-example-ui-extension"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent NeoCogi leaf widget and container plugin example"
publish = false

[lib]
name = "nc_ui_extension"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
neocogi-ui-samples = { workspace = true }
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
neocogi-ui-contracts = { workspace = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
