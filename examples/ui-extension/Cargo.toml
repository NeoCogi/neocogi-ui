[package]
name = "neocogi-example-ui-extension"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent NeoCogi leaf widget and container plugin example"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
com-validation-none = ["neocogi-com/com-validation-none"]
com-validation-sha-256 = ["neocogi-com/com-validation-sha-256"]
com-validation-fnv-1a-128 = ["neocogi-com/com-validation-fnv-1a-128"]
com-validation-mangling = ["neocogi-com/com-validation-mangling"]
dynamic-plugin = []

[dependencies]
neocogi-ui-contracts.workspace = true
neocogi-demo-contracts.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
