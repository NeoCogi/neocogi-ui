[package]
name = "neocogi-example-ui-extension-dylib"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Final dynamic entrypoint for neocogi-example-ui-extension"

[lib]
name = "nc_ui_extension"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
provider = { package = "neocogi-example-ui-extension", path = "..", default-features = false }
neocogi-com = { workspace = true, default-features = false, features = ["std"] }
