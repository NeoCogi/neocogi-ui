[package]
name = "neocogi-demo-host"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
dynamic = ["dep:neocogi-demo-plugins"]
dynamic-skin = ["dynamic", "neocogi-demo-plugins/skin"]
dynamic-extension = ["dynamic", "neocogi-demo-plugins/extension"]
monolith-extension = ["monolith", "dep:neocogi-example-ui-extension"]
glow = ["neocogi-platform?/glow", "neocogi-demo-plugins?/glow"]
vulkan = ["neocogi-platform?/vulkan", "neocogi-demo-plugins?/vulkan"]
wgpu = ["neocogi-platform?/wgpu", "neocogi-demo-plugins?/wgpu"]
webgl = ["dep:neocogi-ui", "neocogi-ui/ui", "neocogi-ui/gfx", "dep:neocogi-platform", "neocogi-platform/webgl"]
png-assets = []
skin = ["dep:neocogi-ui", "neocogi-ui/skin"]
monolith = ["neocogi-com/runtime", "dep:neocogi-ui", "neocogi-ui/ui", "dep:neocogi-platform"]
monolith-gfx = ["monolith", "neocogi-ui/builder"]
monolith-skin = ["monolith", "skin", "neocogi-ui/theme-json"]

[dependencies]
neocogi-platform-contracts = { workspace = true }
neocogi-demo-assets = { workspace = true }
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-platform = { workspace = true, optional = true, features = ["platform"] }
neocogi-example-ui-extension = { path = "../../examples/ui-extension", optional = true, version = "=0.2.0" }
neocogi-ui-contracts = { workspace = true }
neocogi-ui = { workspace = true, optional = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
neocogi-demo-plugins = { path = "../plugins", optional = true, version = "=0.2.0" }
neocogi-com = { workspace = true, features = ["runtime"] }

[target."cfg(target_arch = \"wasm32\")".dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Performance", "Location", "UrlSearchParams", "console"] }
