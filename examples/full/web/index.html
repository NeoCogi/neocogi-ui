<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>neocogi-ui WebGL demo</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #202124;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ddd;
      font: 14px/1.4 system-ui, sans-serif;
      padding: 2rem;
      pointer-events: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Loading neocogi-ui…</div>
  <script type="module">
    const status = document.getElementById("status");
    // A synchronous WASM startup failure may return a Rust exit status after releasing its
    // partially built window. Keep that failure visible instead of treating module loading alone
    // as proof that the application started. Asynchronous JS failures use the same page state.
    let failed = false;
    const showFailure = (message) => {
      failed = true;
      const detail = message?.stack ?? message;
      status.textContent = `Demo failed: ${detail}`;
      if (!status.isConnected) {
        document.body.append(status);
      }
    };

    window.addEventListener("error", (event) => showFailure(event.error ?? event.message));
    window.addEventListener("unhandledrejection", (event) => showFailure(event.reason));
    try {
      const { default: init } = await import("./neocogi-demo-full.js");
      await init();
      const canvas = document.querySelector("canvas");
      if (!canvas) {
        throw new Error("Startup did not create a live canvas. See the browser console for the original error.");
      }
      requestAnimationFrame(() => {
        if (failed) return;
        // Initialization already published this window. A finite one-frame run may normally
        // release it before this page callback; that successful stop is not a startup failure.
        if (canvas.isConnected) canvas.focus();
        status.remove();
      });
    } catch (error) {
      showFailure(error);
    }
  </script>
</body>
</html>
