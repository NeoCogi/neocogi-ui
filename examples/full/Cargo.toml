[package]
name = "neocogi-demo-full"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
dynamic = ["neocogi-demo-host/dynamic-skin"]
default = ["glow", "dynamic"]
monolith = ["neocogi-demo-host/monolith-gfx", "neocogi-demo-host/monolith-skin"]
glow = ["neocogi-demo-host/glow"]
webgl = ["neocogi-demo-host/webgl", "neocogi-demo-host/skin", "embed-assets"]
embed-assets = ["neocogi-demo-assets/embed-assets"]
vulkan = ["neocogi-demo-host/vulkan"]
wgpu = ["neocogi-demo-host/wgpu"]

[dependencies]
neocogi-platform-contracts = { workspace = true }
neocogi-com-host = { workspace = true }
neocogi-ui-samples = { workspace = true }
neocogi-com = { workspace = true, default-features = false, features = ["std", "macros"] }
neocogi-demo-assets = { workspace = true, features = ["full-demo"] }
neocogi-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d = { workspace = true }
neocogi-ui-contracts = { workspace = true }

[target."cfg(target_arch = \"wasm32\")".dev-dependencies]
wasm-bindgen = { workspace = true }
js-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"

[target."cfg(not(target_arch = \"wasm32\"))".dev-dependencies]
pollster = "1"

[dev-dependencies]
neocogi-ui = { workspace = true, features = ["test-support"] }
neocogi-platform = { workspace = true, features = ["test-support"] }
neocogi-ui-contracts = { workspace = true, features = ["test-support"] }
