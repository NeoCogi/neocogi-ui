[package]
name = "neocogi-demo-assets"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
full-demo = ["external-themes"]
external-themes = ["dep:neocogi-ui", "neocogi-ui/authoring"]
embed-assets = ["neocogi-ui-contracts/compiled-assets", "dep:neocogi-ui", "neocogi-ui/builder", "neocogi-ui/save-to-rust", "neocogi-ui/theme-json"]

[dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-ui-contracts = { workspace = true }

[build-dependencies]
neocogi-platform-contracts = { workspace = true, features = ["build-support"] }
serde_json = { workspace = true }
neocogi-ui-contracts = { workspace = true, optional = true }
neocogi-ui = { workspace = true, optional = true }
