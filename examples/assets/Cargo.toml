[package]
name = "neocogi-demo-assets"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Full-only photo/mesh are separate from external themes shared with the smoke client.
full-demo = ["neocogi-ui/skin", "external-themes"]
external-themes = ["dep:neocogi-skin-authoring"]
# Explicit opt-in for self-contained resources, including browser deployments.
embed-assets = ["neocogi-gfx-support/compiled-assets", "dep:neocogi-gfx-impl", "dep:neocogi-skin-impl", "dep:neocogi-gfx-support", "dep:neocogi-gfx-support"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-native-layout.workspace = true

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-gfx-support = { workspace = true, optional = true }

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
# Resolve the host facade only when the asset generator actually runs.
neocogi-gfx-support = { workspace = true, optional = true }
neocogi-gfx-impl = { workspace = true, optional = true, features = ["builder", "save-to-rust"] }
neocogi-skin-impl = { workspace = true, optional = true, features = ["builder", "theme-json"] }

# Host-only resource closure discovery reuses the authoring schema/path visitor.
neocogi-skin-authoring = { path = "../../crates/skin/authoring", optional = true, default-features = false, version = "=0.1.0-alpha.1" }
serde_json.workspace = true
