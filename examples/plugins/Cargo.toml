[package]
name = "neocogi-demo-plugins"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

# This native composition owns only Cargo artifact references and registration.
# Keeping it separate lets the host select normal Rust providers for static builds
# without naming the same dependency twice (Cargo rejects that combination).
[features]
default = []
glow = ["platform-library/glow"]
vulkan = ["platform-library/vulkan"]
wgpu = ["platform-library/wgpu"]
skin = ["dep:skin-library"]
extension = ["dep:extension-library"]

[dependencies]
neocogi-native-layout.workspace = true
neocogi-com = { workspace = true, features = ["runtime"] }
ui-library = { package = "neocogi-ui-runtime-dylib", path = "../../crates/ui/runtime/dylib", artifact = "cdylib" }
nodes-library = { package = "neocogi-ui-nodes-dylib", path = "../../crates/ui/nodes/dylib", artifact = "cdylib" }
shader-library = { package = "neocogi-shader-compiler-dylib", version = "=0.1.0-alpha.1", artifact = "cdylib" }
platform-library = { package = "neocogi-platform-plugin-dylib", version = "=0.1.0-alpha.1", artifact = "cdylib", default-features = false }
gfx-library = { package = "neocogi-gfx-dylib", path = "../../crates/gfx/plugin/dylib", artifact = "cdylib", default-features = false, features = ["builder"] }
skin-library = { package = "neocogi-skin-dylib", path = "../../crates/skin/plugin/dylib", artifact = "cdylib", default-features = false, features = ["theme-json"], optional = true }
extension-library = { package = "neocogi-example-ui-extension-dylib", path = "../../examples/ui-extension/dylib", artifact = "cdylib", optional = true }


[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
neocogi-native-layout-core.workspace = true
neocogi-com-host.workspace = true
tempfile.workspace = true
libloading = "0.8"
runtime-probe = { package = "neocogi-cargo-runtime-probe", path = "tests/runtime-probe", artifact = "cdylib", features = ["dynamic-plugin"] }

[build-dependencies]
neocogi-idl.workspace = true
