name: Rust

on:
  push:
    branches: ["master", "0.9-alpha.0"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The standalone consumer fixtures need no SDL or display server.
  cargo-tool:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - run: cargo test -p cargo-neocogi
      - run: cargo clippy -p cargo-neocogi --all-targets -- -D warnings
      - name: Install nightly standard-library sources
        if: runner.os == 'Linux'
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: Independent nightly min-size consumer and cache reuse
        if: runner.os == 'Linux'
        run: cargo test -p cargo-neocogi --test native nightly_min_size -- --ignored

  # The UI consumes resolved resources; optional construction features belong to assets.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo test -p neocogi-ui-runtime -p neocogi-ui-nodes -p neocogi-ui-support
      - run: cargo test -p neocogi-ui -p neocogi-ui-core-contracts -p neocogi-ui-nodes-contracts -p neocogi-ui-document --features neocogi-ui/static-runtime

  assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "gfx", "publisher", "builder", "save-to-rust", "builder,publisher,save-to-rust"]
    steps:
      - uses: actions/checkout@v6
      - run: cargo test -p neocogi-gfx-impl --no-default-features --features '${{ matrix.features }}' --lib

  # Authoring tests need a real renderer and embedded assets, not just a successful library build.
  authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the offscreen software OpenGL host
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libgl1-mesa-dri
      - name: Validate linked static factory selection
        run: cargo test -p neocogi-demo-host --features monolith-gfx,glow
      # Optional benchmark clients must compile after every ownership/ABI migration.
      - name: Compile the real COM performance harness
        run: cargo check -p neocogi-demo-smoke --no-default-features --features benchmark,glow --bin neocogi-com-bench
      - name: Build the independent provider before designer discovery
        run: cargo rustc -p neocogi-example-ui-extension --lib --crate-type cdylib --features dynamic-plugin
      - name: Exercise the real designer and theme editor
        env:
          SDL_VIDEODRIVER: offscreen
        run: cargo test -p neocogi-ui-designer -p neocogi-theme-editor --lib --features neocogi-ui-designer/monolith,neocogi-ui-designer/embed-assets,neocogi-theme-editor/monolith,neocogi-theme-editor/embed-assets -- --include-ignored --skip benchmark --test-threads=1

  com:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal
      - name: Local ABI, compile cases, inspector and static runtime selection
        run: cargo test -p neocogi-com-core -p neocogi-com-macros -p neocogi-com-runtime -p neocogi-inspect -p neocogi-com --features neocogi-com/static-runtime
      # A debug-only overflow assertion previously let optimized retain return
      # uncounted owners. Exercise the boundary and real C entrypoints in release too.
      - name: Strong-only ownership limits with debug assertions disabled
        run: cargo test -p neocogi-com -p neocogi-com-runtime --lib --release -- --test-threads=1
      - name: IDL value lowering, malformed input and generated compile cases
        run: cargo test -p neocogi-idl
      - name: Driver rejects missing tests, artifacts and stale success evidence
        run: python3 -m unittest discover -s crates/com/scripts -p test_compatibility.py
      - name: Relocated monolith without native NeoCogi libraries
        run: cargo test -p neocogi-example-com-plugin --test build_modes

  # Independent role builds are distinct from ordinary same-compiler unit tests.
  com-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: linked }
          - { os: ubuntu-latest, suite: build-flags }
          - { os: macos-latest, suite: linked }
          - { os: windows-latest, suite: linked }
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - name: Install second compiler for independently selected build policies
        if: matrix.suite == 'build-flags'
        run: rustup toolchain install nightly --profile minimal
      - name: Build explicit runtime DSO and execute relocated host/plugin communication
        run: python3 crates/com/scripts/compatibility.py --suite ${{ matrix.suite }}

  # Miri interprets pure Rust; sanitizers execute the real shared-library boundary.
  com-safety:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [safety, address, thread]
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component miri --component rust-src
      - run: python3 crates/com/scripts/compatibility.py --suite ${{ matrix.suite }}

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [glow, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v6
      - name: Install display and software GPU dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Independently package and execute the full application regression
        run: xvfb-run -a scripts/test-demo.sh ${{ matrix.backend }}
      - name: Independently built custom widget and container
        run: xvfb-run -a scripts/test-extension.sh ${{ matrix.backend }}
      - name: Backend-specific frame/resource checks
        run: xvfb-run -a cargo test -p neocogi-render-plugin --lib --no-default-features --features ${{ matrix.backend }} -- --include-ignored
      - name: Check demo and platform warnings for this backend
        env:
          NC_COM_RUNTIME_LINK_DIR: ${{ github.workspace }}/target/debug
        run: cargo clippy -p neocogi-demo-full -p neocogi-demo-basic -p neocogi-render-plugin --all-targets --no-default-features --features ${{ matrix.backend }} -- -D warnings

  # These jobs validate the native loader/package shape without assuming a hosted runner has a GPU desktop.
  native-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "RUSTFLAGS=-L native=$(brew --prefix sdl2)/lib" >> "$GITHUB_ENV"
      - name: Install SDL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
      - name: Package independently compiled Glow application
        run: cargo run -p cargo-neocogi -- build --assembly full
      - name: Platform-neutral contracts and facade behavior
        run: cargo test -p neocogi-ui-core-contracts -p neocogi-ui --features neocogi-ui/static-runtime

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the static browser application and matching binding tool
        run: scripts/web-demo.sh build
      - name: Real DOM input, IME, static COM objects and WebGL
        run: scripts/test-browser-input.sh input
      - name: All full-demo themes/images/actions and both animation teardown paths
        run: scripts/test-browser-input.sh full
      - name: Compile the WebGL designer and exercise browser file transport
        run: |
          cargo check -p neocogi-ui-designer --target wasm32-unknown-unknown --no-default-features --features webgl
          scripts/test-browser-input.sh designer
