name: Rust

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Debugger metadata checks need no SDL or display server.
  debugger-metadata:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Cargo debugger source-map metadata
        run: python3 -m unittest discover -s scripts -p test_lldb_source_map.py

  release-archives:
    runs-on: ubuntu-latest
    env:
      # Archive tests spawn Cargo consumers; keep their shared build bounded too.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6
      # The qualifier invokes cargo +<pinned-toolchain>; explicit overrides do
      # not install the components listed in rust-toolchain.toml automatically.
      - name: Install Clippy for the workspace toolchain
        run: rustup component add clippy
      - name: Derived license and test input freshness
        run: python3 scripts/package_inputs.py --check
      - name: Archive policy and fixture regressions
        run: python3 -m unittest discover -s scripts -p test_release_packages.py
      - name: Install current stable for the independent consumer
        run: rustup toolchain install stable --profile minimal
      - name: Qualify normalized archives, all features and independent linked/DLL consumers
        run: python3 scripts/check_packages.py --publish-dry-run --stable-toolchain stable

  # The UI consumes resolved resources; optional construction features belong to assets.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Contract dependency ownership and child toolchain checks
        run: python3 -m unittest discover -s scripts -p test_contract_checks.py
      - name: Independent event consumers and generated-only COM control
        run: python3 scripts/check-contract-consumers.py
      - name: Navigation probe and exact source-map boundaries
        run: python3 -m unittest discover -s scripts -p test_idl_navigation.py
      - name: Compile the actual editor navigation probe
        run: python3 scripts/check-idl-navigation.py --compile-only
      - name: Install the selected workspace language-server component
        run: rustup component add rust-analyzer
      - name: Actual editor definitions and exact authored IDL origins
        run: python3 scripts/check-idl-navigation.py
      - run: cargo test --locked -p neocogi-ui-contracts -p neocogi-ui --all-features
      - name: Check UI libraries and tests for warnings
        run: cargo clippy --locked -p neocogi-ui-contracts -p neocogi-ui -p neocogi-ui-dylib --all-features --all-targets -- -D warnings
      - run: cargo test --locked -p neocogi-ui-contracts -p neocogi-ui --all-features --doc

  assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "ui", "gfx", "publisher", "builder", "skin", "authoring", "theme-json", "document", "save-to-rust", "builder,publisher,save-to-rust"]
    steps:
      - uses: actions/checkout@v6
      # Activate the exact production feature set without the broad retained-engine fixtures.
      - run: cargo test --locked -p neocogi-ui --no-default-features --features '${{ matrix.features }}' --test services
      - name: Execute target-profile source export and compiled COM consumers
        if: matrix.features == 'builder,publisher,save-to-rust'
        run: python3 scripts/test-asset-export.py

  # Example integration exercises the real renderer, assets and deployment boundaries.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the offscreen software OpenGL host
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libgl1-mesa-dri
      - name: Validate linked static factory selection
        run: cargo test --locked -p neocogi-demo-host --features monolith-gfx,glow
      # Optional benchmark clients must compile after every ownership/ABI migration.
      - name: Static native composition with the independent extension
        env:
          SDL_VIDEODRIVER: offscreen
        run: cargo run --locked -p neocogi-demo-smoke --no-default-features --features monolith-extension,glow,embed-assets -- --smoke
      - name: Host registry identity through a Cargo-built probe DLL
        run: cargo test --locked -p neocogi-demo-plugins --test shared_runtime --features neocogi-demo-plugins/glow,neocogi-demo-plugins/skin,neocogi-demo-plugins/extension
      - name: Compile the real COM performance harness
        run: cargo check --locked -p neocogi-demo-smoke --no-default-features --features benchmark,glow --bin neocogi-com-bench
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [glow, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v6
      - name: Install display and software GPU dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Independently package and execute the full application regression
        run: xvfb-run -a scripts/test-demo.sh ${{ matrix.backend }}
      - name: Independently built custom widget and container
        run: xvfb-run -a scripts/test-extension.sh ${{ matrix.backend }}
      - name: Native runtime and provider target profiles
        if: matrix.backend == 'vulkan'
        run: python3 scripts/test-native-build.py
      - name: Exact distributions and concurrent private artifact capture
        if: matrix.backend == 'vulkan'
        run: |
          # The Vulkan build above has not populated Glow's optional dependencies.
          # Fetch the locked graph before the packaging checks deliberately go offline.
          cargo fetch --locked
          python3 scripts/test_package_native.py
          python3 scripts/test_package_native.py --production "$RUNNER_TEMP/neocogi-exact-apps"
          cargo test --locked -p neocogi-demo-assets --features external-themes --test paths
          NEOCOGI_DEMO_FRAMES=2 xvfb-run -a "$RUNNER_TEMP/neocogi-exact-apps/full-b/neocogi-demo-full"
      - name: Native path privacy, cached renderer switches and relocated startup
        if: matrix.backend == 'vulkan'
        run: |
          xvfb-run -a python3 scripts/test-native-layout.py --cache --run
          xvfb-run -a python3 scripts/test-native-layout.py --profile release --run
          cargo test --locked -p neocogi-demo-plugins --profile min-size --features vulkan,skin,extension
      - name: Backend-specific frame/resource checks
        run: xvfb-run -a cargo test --locked -p neocogi-ui-platform-tests --no-default-features --features ${{ matrix.backend }} -- --include-ignored --test-threads=1
      - name: Check demo and platform warnings for this backend
        run: cargo clippy --locked -p neocogi-demo-full -p neocogi-demo-basic -p neocogi-ui-platform-tests --all-targets --no-default-features --features dynamic,${{ matrix.backend }} -- -D warnings

  # These jobs validate the native loader/package shape without assuming a hosted runner has a GPU desktop.
  native-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "RUSTFLAGS=-Zosx-rpath-install-name -L native=$(brew --prefix sdl2)/lib" >> "$GITHUB_ENV"
      - name: Install SDL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
      - name: Build Cargo-owned native Glow artifacts
        run: cargo build --locked -p neocogi-demo-full
      - name: Stage the Windows SDL runtime beside the native provider
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # COM loads a provider's imports only from its own directory or System32.
          # PATH alone cannot satisfy nc_platform.dll's SDL2.dll dependency.
          Copy-Item -LiteralPath "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\SDL2.dll" -Destination "target\debug\lib\SDL2.dll" -ErrorAction Stop
      - name: Relocated host and independent plugin share the runtime
        run: cargo test --locked -p neocogi-demo-plugins --test shared_runtime --features neocogi-demo-plugins/glow,neocogi-demo-plugins/skin,neocogi-demo-plugins/extension
      - name: Platform-neutral contracts and facade behavior
        run: cargo test --locked -p neocogi-ui-contracts --features runtime

  browser:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/browser qualification
    steps:
      - uses: actions/checkout@v6
      - name: Browser producer/consumer paths and explicit override policy
        run: python3 -m unittest discover -s scripts -p test_web_paths.py
      - name: Owned HTTP readiness, occupied ports and startup failure cleanup
        run: python3 -m unittest discover -s scripts -p test_browser_server.py
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the static browser application and matching binding tool
        run: scripts/web-demo.sh build
      - name: Real DOM input, IME, static COM objects and WebGL
        run: scripts/test-browser-input.sh input
      - name: All full-demo themes/images/actions and both animation teardown paths
        run: scripts/test-browser-input.sh full
