name: Rust

on:
  push:
    branches: ["master", "0.9-alpha.0"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # UI implementation features belong here; the public facade has no builder/renderer switches.
  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "builder", "png_source", "theme-json", "save-to-rust"]
    steps:
      - uses: actions/checkout@v6
      - run: cargo test -p microui-ui --no-default-features --features '${{ matrix.features }}'
      - run: cargo test -p microui-redux -p microui-contracts
      - run: cargo test -p microui-plugin-assets --features theme-json --lib

  com:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo build -p nc-com-runtime
      - name: Shared runtime, checked ABI, compile cases and independent producer workflows
        env:
          NC_COM_RUNTIME_LINK_DIR: ${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/target/debug/deps
        run: cargo test -p nc-com-core -p nc-com-macros -p nc-com-runtime -p nc-com-inspect -p nc-com --features nc-com/runtime
      - name: Independent static runtime selection
        run: cargo test -p nc-com --no-default-features --features 'std macros static-runtime'

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [glow, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v6
      - name: Install display and software GPU dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Independently package and execute the full application regression
        run: xvfb-run -a scripts/test-demo.sh ${{ matrix.backend }}
      - name: Backend-specific frame/resource checks
        run: xvfb-run -a cargo test -p microui-plugin-platform --lib --no-default-features --features ${{ matrix.backend }} -- --include-ignored
      - name: Check demo and platform warnings for this backend
        env:
          NC_COM_RUNTIME_LINK_DIR: ${{ github.workspace }}/target/debug
        run: cargo clippy -p microui-redux-demo-full -p microui-redux-basic-demos -p microui-plugin-platform --all-targets --no-default-features --features ${{ matrix.backend }} -- -D warnings

  # These jobs validate the native loader/package shape without assuming a hosted runner has a GPU desktop.
  native-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install SDL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install sdl2
          echo "RUSTFLAGS=-L native=$(brew --prefix sdl2)/lib" >> "$GITHUB_ENV"
      - name: Install SDL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sdl2:x64-windows
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIB" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH
      - name: Package independently compiled Glow application
        run: cargo run -p microui-redux-tools --bin com-build -- --backend glow --demo full
      - name: Platform-neutral contracts and facade behavior
        run: cargo test -p microui-contracts -p microui-redux

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the static browser application and matching binding tool
        run: scripts/web-demo.sh build
      - name: Real DOM input, IME, static COM objects and WebGL
        run: scripts/test-browser-input.sh input
      - name: All full-demo themes/images/actions and both animation teardown paths
        run: scripts/test-browser-input.sh full
