[package]
name = "microui-redux"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static typed Rust facade for COM-based microui plugins"

[dependencies]
microui-contracts.workspace = true
nc-com = { workspace = true, features = ["macros", "std"] }

[features]
default = []
# Internal behavior fixtures; ordinary plugin and application builds do not expose queue leases.
test-support = []
# Deployment policy belongs to the final application, not implementation plugins.
runtime = ["nc-com/runtime"]
static-runtime = ["nc-com/static-runtime"]
