[package]
name = "neocogi-gfx-impl"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private image, atlas, and bundle implementation for the NeoCogi GFX plugin"
publish = false

[lib]
# The deployable GFX crate wraps this implementation library without another DSO.
crate-type = ["rlib"]

[features]
default = []
gfx = ["dep:png"]
publisher = []
builder = ["gfx", "dep:fontdue"]
save-to-rust = ["dep:tempfile", "dep:miniz_oxide"]

[dependencies]
tempfile = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }
neocogi-gfx-contracts.workspace = true
neocogi-gfx-support.workspace = true
neocogi-appearance.workspace = true
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true
png = { workspace = true, optional = true }
fontdue = { workspace = true, optional = true }
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[dev-dependencies]
# Every isolated test executable owns its process runtime, independently of workspace unification.
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-runtime.workspace = true
neocogi-ui.workspace = true
neocogi-ui-support.workspace = true
# Allocation-failure regressions submit through the production CPU frame importer.
neocogi-render-support.workspace = true
