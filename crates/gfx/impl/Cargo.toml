[package]
name = "neocogi-gfx-impl"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Image, atlas, and bundle implementation for the NeoCogi GFX plugin"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"

[lib]
# The deployable GFX crate wraps this implementation library without another DSO.
crate-type = ["rlib"]

[features]
default = []
gfx = ["dep:png"]
publisher = []
builder = ["gfx", "dep:fontdue"]
save-to-rust = ["dep:tempfile", "dep:miniz_oxide"]

[dependencies]
tempfile = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }
neocogi-gfx-support.workspace = true
neocogi-appearance.workspace = true
neocogi-render-core.workspace = true
png = { workspace = true, optional = true }
fontdue = { workspace = true, optional = true }
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[dev-dependencies]
# Cargo omits these cyclic local peer links on publication.
# package_inputs.py preserves exact archive-test requirements separately.
neocogi-gfx-support = { path = "../support", features = ["test-support"] }
neocogi-render-gpu.workspace = true
# Every isolated test executable owns its process runtime, independently of workspace unification.
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
neocogi-ui = { path = "../../ui/api", default-features = false }
neocogi-ui-support = { path = "../../ui/support", default-features = false }
# Allocation-failure regressions submit through the production CPU frame importer.
neocogi-render-support.workspace = true
