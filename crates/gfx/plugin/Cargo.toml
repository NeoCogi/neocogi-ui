[package]
name = "neocogi-gfx"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi CPU image decoding and portable resource-baking plugin"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"

[lib]
# Reusable implementation; the dylib subpackage alone owns the native loader export.
name = "nc_gfx"
crate-type = ["rlib"]

[features]
default = []
builder = ["neocogi-gfx-impl/builder"]

[dependencies]
neocogi-gfx-impl = { workspace = true, features = ["gfx", "publisher"] }
neocogi-gfx-support.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
