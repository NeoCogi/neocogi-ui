[package]
name = "neocogi-gfx"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi CPU image decoding and portable resource-baking plugin"
publish = false

[lib]
# The Rust target also defines the deployed shared-library name on each platform.
name = "nc_gfx"
crate-type = ["rlib", "cdylib"]

[features]
default = []
builder = ["neocogi-gfx-impl/builder"]
dynamic-plugin = []

[dependencies]
neocogi-gfx-impl = { workspace = true, features = ["gfx", "publisher"] }
neocogi-gfx-support.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
