[package]
name = "neocogi-gfx-support"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Non-plugin Rust support for portable NeoCogi GFX bundles"
publish = false

[features]
default = []
compiled-assets = ["dep:miniz_oxide"]
# Headless integration fixtures execute the real graphics recorder without a native device.
test-support = ["dep:neocogi-render-gpu", "neocogi-render-gpu/test-support", "dep:neocogi-shader-compiler"]

[dependencies]
neocogi-shader-compiler = { workspace = true, optional = true }
rs-math3d.workspace = true
neocogi-render-core.workspace = true
neocogi-render-gpu = { workspace = true, optional = true }
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
miniz_oxide = { workspace = true, optional = true }

[build-dependencies]
neocogi-platform-build.workspace = true
neocogi-idl.workspace = true
