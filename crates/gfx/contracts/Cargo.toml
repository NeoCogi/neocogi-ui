[package]
name = "neocogi-gfx-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pixel decoding and portable resource-baking ABI contracts for NeoCogi"
# Cargo owner for IDL module `neocogi.gfx`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e676678"

[package.metadata.neocogi-contract]
module = "neocogi.gfx"
source = "idl/neocogi/gfx"

[dependencies]
neocogi-com = { workspace = true, features = ["macros"] }
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
