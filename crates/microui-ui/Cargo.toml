[package]
name = "microui-ui"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
description = "Retained Rust MicroUI-inspired GUI library"
repository.workspace = true
categories = ["gui", "rendering"]

[lib]
name = "microui_ui"
crate-type = ["rlib"]

[features]
default = []
builder = ["dep:fontdue", "dep:png"]
png_source = ["dep:png"]
theme-json = ["microui-contracts/theme-json", "builder", "dep:serde", "dep:serde_json", "png_source"]
save-to-rust = ["dep:tempfile"]

[dependencies]
# Standard plugin-owned compositions reuse the static typed clients and owned event adapter.
microui-redux.workspace = true
microui-contracts.workspace = true
nc-com = { workspace = true, features = ["macros", "std"] }
bitflags.workspace = true
fontdue = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rs-math3d.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
microui-redux = { workspace = true, features = ["test-support"] }
rand.workspace = true
tempfile.workspace = true
trybuild.workspace = true
