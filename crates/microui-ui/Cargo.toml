[package]
name = "microui-ui"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
description = "Retained Rust MicroUI-inspired GUI library"
repository.workspace = true
categories = ["gui", "rendering"]

[lib]
name = "microui_ui"
crate-type = ["rlib"]

[dependencies]
# Standard plugin-owned compositions reuse the static typed clients and owned event adapter.
microui-redux.workspace = true
microui-contracts.workspace = true
neocogi-com = { workspace = true, features = ["macros", "std"] }
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
microui-plugin-assets.workspace = true
microui-redux = { workspace = true, features = ["test-support"] }
rand.workspace = true
tempfile.workspace = true
trybuild.workspace = true
