[package]
name = "neocogi-skin-authoring"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared typed theme documents and compilation for NeoCogi tools and Skin"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"

[features]
default = []
# Offline exporters may instantiate GFX locally; live tools supply its capabilities.
builder = ["dep:neocogi-gfx-impl"]

[dependencies]
neocogi-render-core.workspace = true
neocogi-gfx-impl = { workspace = true, optional = true, features = ["builder", "publisher"] }
neocogi-gfx-support.workspace = true
neocogi-appearance.workspace = true
neocogi-com = { workspace = true, features = ["macros", "std"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true

[dev-dependencies]
neocogi-ui-support.workspace = true
