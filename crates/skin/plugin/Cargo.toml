[package]
name = "neocogi-skin"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi appearance and external-theme plugin"
publish = false

[lib]
# The Rust target also defines the deployed shared-library name on each platform.
name = "nc_skin"
crate-type = ["rlib", "cdylib"]

[features]
default = []
theme-json = ["neocogi-skin-impl/theme-json"]
dynamic-plugin = ["dep:neocogi-native-runtime-link"]

[dependencies]
neocogi-skin-impl.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-skin-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
neocogi-native-runtime-link = { workspace = true, optional = true }
