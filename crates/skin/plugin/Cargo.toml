[package]
name = "neocogi-skin"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi appearance and external-theme plugin"
publish = false

[lib]
# Reusable implementation; the dylib subpackage alone owns the native loader export.
name = "nc_skin"
crate-type = ["rlib"]

[features]
default = []
theme-json = ["neocogi-skin-impl/theme-json"]

[dependencies]
neocogi-skin-impl.workspace = true
neocogi-gfx-support.workspace = true
neocogi-appearance.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
