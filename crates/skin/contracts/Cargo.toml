[package]
name = "neocogi-skin-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Appearance and theme-compilation ABI contracts for NeoCogi"
# Cargo owner for IDL module `neocogi.skin`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e736b696e"

[package.metadata.neocogi-contract]
module = "neocogi.skin"
source = "idl/neocogi/skin"

[dependencies]
neocogi-com = { workspace = true, features = ["macros"] }
neocogi-gfx-contracts.workspace = true
neocogi-platform-contracts.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
