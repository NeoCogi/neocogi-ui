[package]
name = "neocogi-skin-impl"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Style and external-theme implementation for the NeoCogi Skin plugin"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"

[lib]
# The deployable Skin crate wraps this implementation library without another DSO.
crate-type = ["rlib"]

[features]
default = []
theme-json = ["dep:neocogi-skin-authoring"]
# Offline theme generation statically instantiates the same GFX services used by deployed Skin.
builder = ["neocogi-skin-authoring?/builder"]

[dependencies]
neocogi-skin-authoring = { workspace = true, optional = true }
neocogi-gfx-support.workspace = true
neocogi-appearance.workspace = true
neocogi-render-core.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[dev-dependencies]
tempfile.workspace = true
neocogi-gfx-impl = { workspace = true, features = ["builder", "publisher"] }
neocogi-ui.workspace = true
neocogi-ui-support.workspace = true
