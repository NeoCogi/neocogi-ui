[package]
name = "neocogi-skin-impl"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private style and external-theme implementation for the NeoCogi Skin plugin"
publish = false

[lib]
# The deployable Skin crate wraps this implementation library without another DSO.
crate-type = ["rlib"]

[features]
default = []
theme-json = ["dep:serde", "dep:serde_json"]
# Offline theme generation statically instantiates the same GFX services used by deployed Skin.
builder = ["dep:neocogi-gfx-impl"]

[dependencies]
neocogi-gfx-impl = { workspace = true, optional = true, features = ["builder", "publisher"] }
neocogi-gfx-contracts.workspace = true
neocogi-gfx-support.workspace = true
neocogi-skin-contracts.workspace = true
neocogi-appearance.workspace = true
neocogi-platform-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
neocogi-gfx-impl = { workspace = true, features = ["builder", "publisher"] }
neocogi-ui.workspace = true
neocogi-ui-runtime.workspace = true
