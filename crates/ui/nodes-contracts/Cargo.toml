[package]
name = "neocogi-ui-nodes-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Concrete built-in node COM contracts for NeoCogi UI"
# Cargo owner for IDL module `neocogi.ui.nodes`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e75692e6e6f646573"

[package.metadata.neocogi-contract]
module = "neocogi.ui.nodes"
source = "idl/neocogi/ui/nodes"

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-ui-core-contracts.workspace = true
neocogi-renderer-contracts.workspace = true
neocogi-gfx-contracts.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
