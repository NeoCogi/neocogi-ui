[package]
name = "neocogi-ui-document"
version.workspace = true
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed NeoCogi UI documents, component reconstruction and reload"

[dependencies]
neocogi-ui.workspace = true
neocogi-ui-design.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros", "runtime"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
neocogi-ui-samples.workspace = true
# Unit tests exercise document loading through the ordinary static runtime.
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
