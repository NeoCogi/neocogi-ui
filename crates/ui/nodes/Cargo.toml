[package]
name = "neocogi-ui-nodes"
version.workspace = true
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deployable built-in NeoCogi UI node implementations and standard compositions"

[lib]
# Static consumers and the final DLL use the same implementation; this target exports no loader symbol.
name = "nc_ui_nodes"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
neocogi-ui-support.workspace = true
neocogi-ui.workspace = true
rs-math3d.workspace = true
bitflags.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[dev-dependencies]
# Cargo omits these cyclic local peer links on publication.
# package_inputs.py preserves exact archive-test requirements separately.
# Direct algorithm tests use the real host and its native scoped-dispatch driver.
neocogi-ui-runtime = { path = "../runtime", features = ["test-support"], default-features = false }
neocogi-ui-support = { path = "../support", features = ["test-support"], default-features = false }
neocogi-ui = { path = "../api", default-features = false }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
