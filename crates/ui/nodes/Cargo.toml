[package]
name = "neocogi-ui-nodes"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deployable built-in NeoCogi UI node implementations and standard compositions"

[lib]
# cargo-neocogi wraps this implementation rlib in the assembly's deployable
# cdylib root so the plugin owns one native shared object per deployment.
name = "neocogi_ui_nodes"
crate-type = ["rlib"]

[features]
default = []
# Only deployable dynamic libraries publish the stable plugin descriptor entrypoint.
dynamic-plugin = []

[dependencies]
neocogi-ui-implementation = { package = "neocogi-ui-impl", path = "../runtime" }
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
