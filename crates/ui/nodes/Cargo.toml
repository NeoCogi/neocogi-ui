[package]
name = "neocogi-ui-nodes"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deployable built-in NeoCogi UI node implementations and standard compositions"

[lib]
# Keep direct Cargo builds and packaged shared libraries under the same short name.
name = "nc_ui_nodes"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Only deployable dynamic libraries publish the stable plugin descriptor entrypoint.
dynamic-plugin = ["dep:com-library"]

[dependencies]
neocogi-ui-support.workspace = true
neocogi-ui.workspace = true
rs-math3d.workspace = true
bitflags.workspace = true
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }

[dev-dependencies]
# Tests construct the real core runtime through its public entrypoint, never private storage.
neocogi-ui-runtime.workspace = true
neocogi-ui-support = { workspace = true, features = ["test-support"] }
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["static-runtime"] }
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
# Shared-mode facade features may be unified by the host. Every DLL that can
# import runtime APIs consumes the same Cargo-owned runtime artifact path.
com-library = { package = "neocogi-com-runtime", git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "9d85aca5180f343d75ed14a3d1082f71482824e9", artifact = "cdylib", target = "target", optional = true }
