[package]
name = "neocogi-ui-runtime"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deployable core retained UI runtime, surfaces, menus, and window manager"

[lib]
# cargo-neocogi wraps this implementation rlib in the assembly's deployable
# cdylib root, giving the core runtime exactly one plugin bootstrap entrypoint.
name = "neocogi_ui_runtime"
crate-type = ["rlib"]

[features]
default = []
# Only deployable dynamic libraries publish the stable plugin descriptor entrypoint.
dynamic-plugin = []

[dependencies]
neocogi-ui-implementation = { package = "neocogi-ui-impl", path = "../runtime" }
neocogi-ui-core-contracts.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
