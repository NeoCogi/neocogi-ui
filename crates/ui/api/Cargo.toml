[package]
name = "neocogi-ui"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust client API for NeoCogi UI components"

[dependencies]
neocogi-render-core.workspace = true
neocogi-gfx-support.workspace = true
neocogi-appearance = { workspace = true, optional = true }
neocogi-com = { workspace = true, features = ["macros", "std"] }

[features]
default = []
# Owned application fixtures; no implementation or process-runtime linkage is added.
test-support = []
# Optional authoring clients keep unrelated plugin contracts out of UI/runtime binaries.
skin = ["dep:neocogi-appearance"]
# Deployment policy belongs to the final application, not implementation plugins.
runtime = ["neocogi-com/runtime"]

[dev-dependencies]
neocogi-idl.workspace = true
neocogi-ui-design.workspace = true
tempfile.workspace = true
trybuild.workspace = true

# Every integration-test executable owns its linked runtime, independently of
# production feature unification or a deployed native shared library.
neocogi-com-host.workspace = true

[build-dependencies]
neocogi-render-core.workspace = true
neocogi-idl.workspace = true
