[package]
name = "neocogi-ui"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust client API for NeoCogi UI components"

[dependencies]
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-com-events.workspace = true
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-gfx-support.workspace = true
neocogi-skin-contracts = { workspace = true, optional = true }
neocogi-com = { workspace = true, features = ["macros", "std"] }

[features]
default = []
# Optional authoring clients keep unrelated plugin contracts out of UI/runtime binaries.
skin = ["dep:neocogi-skin-contracts"]
# Internal behavior fixtures; ordinary plugin and application builds do not expose queue leases.
test-support = ["neocogi-com-events/test-support"]
# Deployment policy belongs to the final application, not implementation plugins.
runtime = ["neocogi-com/runtime"]
static-runtime = ["neocogi-com/static-runtime"]
