[workspace]
resolver = "3"
exclude = ["target", "tmp"]
members = [
    "crates/build",
    "crates/ui/design",
    "crates/ui/document",
    "crates/gfx/support",
    "crates/gfx/impl",
    "crates/gfx/plugin",
    "crates/gfx/plugin/dylib",
    "crates/appearance",
    "crates/skin/authoring",
    "crates/skin/impl",
    "crates/skin/plugin",
    "crates/skin/plugin/dylib",
    "examples/ui-extension",
    "examples/ui-extension/dylib",
    "examples/runtime-ui",
    "crates/ui/api",
    "crates/ui/runtime",
    "crates/ui/runtime/dylib",
    "crates/ui/support",
    "crates/ui/nodes",
    "crates/ui/nodes/dylib",
    "examples/assets",
    "examples/host",
    "examples/plugins",
    "examples/full",
    "examples/ui-samples",
    "examples/basic",
    "examples/smoke",
    "tools/assets",
    "tests/platform",
]
default-members = ["crates/ui/api"]

[workspace.package]
version = "0.1.0-alpha.1"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
repository = "https://github.com/NeoCogi/neocogi-ui"

[workspace.dependencies]
neocogi-ui-build = { path = "crates/build", version = "=0.1.0-alpha.1" }
neocogi-platform-build = { version = "=0.1.0-alpha.1" }
neocogi-native-layout-core = { version = "=0.1.0-alpha.1" }
neocogi-shader-core = { version = "=0.1.0-alpha.1" }
neocogi-shader-compiler = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-ui-samples = { path = "examples/ui-samples", version = "=0.1.0-alpha.1" }
neocogi-ui-design = { path = "crates/ui/design", version = "=0.1.0-alpha.1" }
neocogi-ui-document = { path = "crates/ui/document", version = "=0.1.0-alpha.1" }
neocogi-gfx-support = { path = "crates/gfx/support", version = "=0.1.0-alpha.1" }
neocogi-gfx-impl = { path = "crates/gfx/impl", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-gfx = { path = "crates/gfx/plugin", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-appearance = { path = "crates/appearance", version = "=0.1.0-alpha.1" }
neocogi-skin-authoring = { path = "crates/skin/authoring", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-skin-impl = { path = "crates/skin/impl", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-skin = { path = "crates/skin/plugin", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-com = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-com-host = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-native-layout = { version = "=0.1.0-alpha.1" }
neocogi-idl = { version = "=0.1.0-alpha.1" }
neocogi-ui = { path = "crates/ui/api", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-ui-support = { path = "crates/ui/support", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-ui-runtime = { path = "crates/ui/runtime", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-ui-nodes = { path = "crates/ui/nodes", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-demo-assets = { path = "examples/assets", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-demo-host = { path = "examples/host", default-features = false, version = "=0.1.0-alpha.1" }
neocogi-render-gpu = { version = "=0.1.0-alpha.1" }
neocogi-render-core = { version = "=0.1.0-alpha.1" }
neocogi-render-support = { version = "=0.1.0-alpha.1" }
bitflags = "2.4.1"
fontdue = "0.9.2"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
rs-math3d = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "=1.0.116"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
neocogi-platform-plugin = { version = "=0.1.0-alpha.1", default-features = false }

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
