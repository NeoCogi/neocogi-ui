[package]
name = "neocogi-ui-support"
version.workspace = true
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Non-deployable resource and presentation helpers shared by UI providers"

[features]
default = []
# Fixtures supply canonical assets and phase snapshots without replacing runtime behavior.
test-support = ["neocogi-ui/test-support", "dep:neocogi-appearance", "dep:neocogi-gfx"]

[dependencies]
neocogi-appearance = { workspace = true, optional = true }
neocogi-gfx = { workspace = true, optional = true }
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
neocogi-render-core.workspace = true
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
# Cargo omits these cyclic local peer links on publication.
# package_inputs.py preserves exact archive-test requirements separately.
neocogi-appearance = { path = "../../appearance" }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
