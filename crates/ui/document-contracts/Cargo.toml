[package]
name = "neocogi-ui-document-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Cargo owner for IDL module `neocogi.ui.document`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e75692e646f63756d656e74"

[package.metadata.neocogi-contract]
module = "neocogi.ui.document"
source = "idl/neocogi/ui/document"

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
