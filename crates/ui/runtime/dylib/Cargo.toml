[package]
name = "neocogi-ui-runtime-dylib"
version.workspace = true
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Final dynamic entrypoint for neocogi-ui-runtime"

[lib]
name = "nc_ui"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
provider = { package = "neocogi-ui-runtime", path = "..", default-features = false, version = "=0.1.0-alpha.2" }
neocogi-com = { workspace = true, default-features = false, features = ["std"] }
