[package]
name = "neocogi-ui-runtime"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
description = "Retained UI runtime, built-in nodes, surfaces, and window manager"
repository.workspace = true
categories = ["gui", "rendering"]

[lib]
# cargo-neocogi wraps this implementation rlib in the assembly's deployable
# cdylib root, avoiding an additional shared-library link for the same code.
name = "neocogi_ui_runtime"
crate-type = ["rlib"]

[features]
default = []
# Generates and checks exact ABI contracts for this component graph.
abi-validation = ["neocogi-com/abi-validation"]
# Only deployable dynamic libraries publish the plugin descriptor entrypoint.
dynamic-plugin = []

[dependencies]
# Standard plugin-owned compositions reuse the static typed clients and owned event adapter.
neocogi-ui.workspace = true
neocogi-ui-contracts.workspace = true
neocogi-com = { workspace = true, features = ["macros", "std"] }
neocogi-render-core.workspace = true
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
neocogi-assets.workspace = true
neocogi-ui = { workspace = true, features = ["test-support"] }
rand.workspace = true
tempfile.workspace = true
trybuild.workspace = true
