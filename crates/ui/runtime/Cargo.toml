[package]
name = "neocogi-ui-runtime"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
description = "Deployable core retained UI runtime, scoped services, surfaces and menus"
repository.workspace = true
categories = ["gui", "rendering"]

[lib]
# Keep direct Cargo builds and packaged shared libraries under the same short name.
# cargo-neocogi wraps this implementation rlib in the assembly's deployable
# cdylib root, avoiding an additional shared-library link for the same code.
name = "nc_ui"
crate-type = ["rlib"]

[dependencies]
neocogi-ui-support.workspace = true
neocogi-ui-core-contracts.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-renderer-contracts.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
neocogi-ui-document.workspace = true
neocogi-idl-example-contracts = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "9a8809e18d38fd7257381b12ebf86de7f11ff4b7" }
neocogi-ui-nodes.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-ui-support = { workspace = true, features = ["test-support"] }
neocogi-com = { workspace = true, features = ["static-runtime"] }
neocogi-demo-assets = { workspace = true, features = ["embed-assets"] }
neocogi-gfx-impl = { workspace = true, features = ["publisher"] }
neocogi-skin-impl.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-skin-contracts.workspace = true
neocogi-ui.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[features]
default = []
# A final dynamic artifact owns the loader entrypoint; static clients use the descriptor directly.
dynamic-plugin = []
