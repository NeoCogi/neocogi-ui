[package]
name = "neocogi-ui-runtime"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
description = "Deployable core retained UI runtime, scoped services, surfaces and menus"
repository.workspace = true
categories = ["gui", "rendering"]


[build-dependencies]
neocogi-render-core.workspace = true
neocogi-idl.workspace = true

[lib]
# Keep direct Cargo builds and packaged shared libraries under the same short name.
name = "nc_ui"
crate-type = ["rlib", "cdylib"]

[dependencies]
neocogi-ui-support.workspace = true
neocogi-ui.workspace = true
neocogi-gfx-support.workspace = true
neocogi-render-core.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
neocogi-render-gpu.workspace = true
neocogi-ui-document.workspace = true
neocogi-ui-nodes.workspace = true
neocogi-ui-support = { workspace = true, features = ["test-support"] }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
neocogi-demo-assets = { workspace = true, features = ["embed-assets"] }
neocogi-gfx-impl = { workspace = true, features = ["publisher"] }
neocogi-skin-impl.workspace = true
neocogi-gfx-support = { workspace = true, features = ["test-support"] }
neocogi-appearance.workspace = true
neocogi-ui.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[features]
default = []
# Typed owner driver for native algorithm tests; no scope control is exported over COM.
test-support = []
# A final dynamic artifact owns the loader entrypoint; static clients use the descriptor directly.
dynamic-plugin = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
