[package]
name = "neocogi-ui-runtime"
version.workspace = true
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
authors.workspace = true
edition.workspace = true
readme = "README.md"
license.workspace = true
description = "Deployable core retained UI runtime, scoped services, surfaces and menus"
repository.workspace = true
categories = ["gui", "rendering"]


[build-dependencies]
neocogi-ui-build.workspace = true
neocogi-idl.workspace = true

[lib]
# Static consumers and the final DLL use the same implementation; this target exports no loader symbol.
name = "nc_ui"
crate-type = ["rlib"]

[dependencies]
neocogi-ui-support.workspace = true
neocogi-ui.workspace = true
neocogi-gfx-support.workspace = true
neocogi-render-core.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
bitflags.workspace = true
rs-math3d.workspace = true

[dev-dependencies]
# Cargo omits these cyclic local peer links on publication.
# package_inputs.py preserves exact archive-test requirements separately.
neocogi-shader-compiler.workspace = true
neocogi-render-gpu = {workspace=true,features=["test-support"]}
neocogi-ui-document = { path = "../document" }
neocogi-ui-nodes = { path = "../nodes", default-features = false }
neocogi-ui-support = { path = "../support", features = ["test-support"], default-features = false }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
neocogi-gfx-impl = { path = "../../gfx/impl", features = ["publisher"], default-features = false }
neocogi-skin-impl = { path = "../../skin/impl", default-features = false }
neocogi-gfx-support = { path = "../../gfx/support", features = ["test-support"] }
neocogi-appearance = { path = "../../appearance" }
neocogi-ui = { path = "../api", default-features = false }
tempfile.workspace = true
trybuild.workspace = true

[features]
default = []
# Typed owner driver for native algorithm tests; no scope control is exported over COM.
test-support = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
