[package]
name = "neocogi-ui-core-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core typed COM contracts shared by NeoCogi UI hosts and components"
# Cargo owner for IDL module `neocogi.ui.core`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e75692e636f7265"

[package.metadata.neocogi-contract]
module = "neocogi.ui.core"
source = "idl/neocogi/ui/core"

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true
neocogi-gfx-contracts.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
