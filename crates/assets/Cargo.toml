[package]
name = "neocogi-assets"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi asset decoding, compilation, and plugin services"
publish = false

[lib]
# The assembly-generated cdylib root is the only native plugin artifact; this
# implementation stays reusable as an rlib without triggering a redundant link.
crate-type = ["rlib"]

[features]
default = []
builder = ["dep:fontdue"]
theme-json = ["builder", "dep:serde", "dep:serde_json"]
save-to-rust = ["dep:tempfile", "dep:miniz_oxide"]
dynamic-plugin = []

[dependencies]
tempfile = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true, features = ["with-alloc"] }
neocogi-ui-contracts.workspace = true
neocogi-ui.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
png.workspace = true
fontdue = { workspace = true, optional = true }
neocogi-com = { workspace = true, features = ["macros", "std"] }

[dev-dependencies]
neocogi-ui-runtime.workspace = true
