[package]
name = "neocogi-appearance"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure typed appearance compilation shared by NeoCogi GFX construction and Skin"
publish = ["crates-io"]
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "docs/**", "tests/**", "schemas/**", "EVENTS.md"]
readme = "README.md"

[dependencies]
neocogi-com = { workspace = true, features = ["alloc"] }
neocogi-render-core.workspace = true
neocogi-gfx-support.workspace = true

[build-dependencies]
neocogi-ui-build.workspace = true
neocogi-idl.workspace = true
