[unstable]
# Native development compositions use Cargo-provided cdylib artifacts.
bindeps = true
# Cargo cannot enable build-std conditionally by profile. Rebuild target std in
# this nightly development workspace so plain --profile min-size is complete;
# portable SDK consumers outside this workspace continue using prebuilt std.
build-std = ["std", "panic_abort", "test", "proc_macro"]
# Preserve normal backtraces and unwind-based tests in non-minimal profiles.
# Immediate abort makes their unused paths removable in min-size applications.
build-std-features = ["backtrace", "panic-unwind", "optimize_for_size"]
panic-immediate-abort = true
# Keep target test dependencies on their selected panic strategy when std is
# rebuilt. libtest isolates panic expectations in child processes for abort mode.
panic-abort-tests = true
profile-rustflags = true
trim-paths = true

# Deployed binaries and embedded panic/debug locations must not disclose the
# checkout, Cargo home or compiler installation. Debug unremap sidecars stay local.
[profile.dev]
trim-paths = "all"

[profile.release]
trim-paths = "all"

[profile.min-size]
panic = "immediate-abort"
rustflags = [
    "-Cforce-unwind-tables=no",
    "-Zlocation-detail=none",
    "-Zfmt-debug=none",
]

# Build scripts and procedural macros must retain normal host panic/diagnostic
# behavior. Only deployed target code receives the min-size compiler flags.
[profile.min-size.build-override]
rustflags = []

[alias]
# Convenience only: the profile itself owns all target compiler settings.
build-min-size = ["build", "--profile", "min-size"]

# Use relative Mach-O identities without enabling rustc's inferred build rpaths.
[target.'cfg(target_vendor = "apple")']
rustflags = ["-Zosx-rpath-install-name"]
