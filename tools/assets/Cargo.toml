[package]
autobins = false
name = "neocogi-asset-tools"
version.workspace = true
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["png_source"]
png_source = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }
neocogi-ui = { workspace = true, features = ["builder", "save-to-rust"] }

[[bin]]
name = "neocogi-atlas-export"
path = "src/bin/atlas-export.rs"

[[bin]]
name = "neocogi-mac-os-9-theme-export"
path = "src/bin/mac-os-9-theme-export.rs"
required-features = ["png_source"]
