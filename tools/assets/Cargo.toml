[package]
name = "neocogi-asset-tools"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["png_source"]
png_source = ["dep:png"]

[dependencies]
neocogi-gfx-impl = { workspace = true, features = ["builder", "save-to-rust"] }
png = { workspace = true, optional = true }

[[bin]]
name = "atlas-export"
path = "src/bin/atlas-export.rs"

[[bin]]
name = "mac-os-9-theme-export"
path = "src/bin/mac-os-9-theme-export.rs"
required-features = ["png_source"]
