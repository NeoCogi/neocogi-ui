[package]
name = "microui-redux-demo-host"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Native selection belongs to the separately built platform package.
glow = []
vulkan = []
wgpu = []
webgl = ["microui-plugin-platform/webgl"]
# Browser modules link the same optional decoder/style descriptor staged as a native asset plugin.
png-assets = ["dep:microui-plugin-assets"]

[dependencies]
microui-redux.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
neocogi-com = { workspace = true, features = ["static-runtime"] }
microui-plugin-ui = { path = "../../plugins/ui" }
microui-plugin-platform = { path = "../../plugins/platform", default-features = false }
microui-plugin-assets = { path = "../../plugins/assets", optional = true, default-features = false }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance", "Location", "UrlSearchParams", "console"] }
