[package]
name = "neocogi-demo-contracts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
# Cargo owner for IDL module `neocogi.demo`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e64656d6f"

[package.metadata.neocogi-contract]
module = "neocogi.demo"
source = "idl/neocogi/demo.ncidl"

[dependencies]
neocogi-ui-core-contracts.workspace = true
neocogi-ui-document-contracts.workspace = true
neocogi-com = { workspace = true }

[build-dependencies]
neocogi-idl.workspace = true
