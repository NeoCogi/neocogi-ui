[package]
name = "neocogi-demo-full"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["glow"]
# Keeps the application, linked component roots, and runtime on one strict ABI
# contract mode when an assembly opts into validation.
abi-validation = [
    "neocogi-com/abi-validation",
    "neocogi-com-runtime/abi-validation",
    "neocogi-ui-runtime/abi-validation",
    "neocogi-render-plugin/abi-validation",
    "neocogi-assets/abi-validation",
]
glow = ["neocogi-demo-host/glow", "neocogi-render-plugin/glow"]
webgl = ["neocogi-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-demo-assets/embed-assets"]
vulkan = ["neocogi-demo-host/vulkan", "neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-demo-host/wgpu", "neocogi-render-plugin/wgpu"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-demo-contracts.workspace = true
neocogi-demo-assets = { workspace = true, features = ["full-demo"] }
neocogi-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Build the shared artifacts as dependencies; native startup still loads their C ABI.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime", features = ["dynamic-plugin"] }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "87b6564446ee158b6cf83bfb5949a204014a8833", default-features = false, features = ["dynamic-plugin"] }
neocogi-assets = { workspace = true, features = ["dynamic-plugin", "theme-json"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
