[package]
name = "neocogi-demo-full"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["glow"]
# Link the full assembly's runtime, UI, renderer, GFX, and Skin implementations.
monolith = ["neocogi-demo-host/monolith-gfx", "neocogi-demo-host/monolith-skin"]
glow = ["neocogi-demo-host/glow", "neocogi-render-plugin/glow"]
# The browser's live style editor needs Skin even though authored themes are precompiled.
webgl = ["neocogi-demo-host/webgl", "neocogi-demo-host/skin", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-demo-assets/embed-assets"]
vulkan = ["neocogi-demo-host/vulkan", "neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-demo-host/wgpu", "neocogi-render-plugin/wgpu"]

[dependencies]
neocogi-ui-samples.workspace = true
neocogi-ui = { workspace = true, features = ["skin"] }
neocogi-com = { workspace = true, default-features = false, features = ["std", "macros"] }
neocogi-demo-contracts.workspace = true
neocogi-render-mesh-contracts.workspace = true
neocogi-demo-assets = { workspace = true, features = ["full-demo"] }
neocogi-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Dynamic assembly roots add `dynamic-plugin`; monoliths call descriptors directly.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime" }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "73c1dc9694e26fe647efdf7b84448d49a6d77be0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
neocogi-ui = { workspace = true, features = ["test-support"] }
