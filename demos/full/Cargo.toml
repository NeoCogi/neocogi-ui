[package]
name = "neocogi-demo-full"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["glow"]
# Each option forwards one validation representation through every statically
# visible part of the application graph. cargo-neocogi applies the same option
# to separately linked runtime and plugin roots.
com-validation-none = ["neocogi-com/com-validation-none", "neocogi-com-runtime/com-validation-none", "neocogi-ui-runtime/com-validation-none", "neocogi-render-plugin/com-validation-none", "neocogi-assets/com-validation-none"]
com-validation-sha-256 = ["neocogi-com/com-validation-sha-256", "neocogi-com-runtime/com-validation-sha-256", "neocogi-ui-runtime/com-validation-sha-256", "neocogi-render-plugin/com-validation-sha-256", "neocogi-assets/com-validation-sha-256"]
com-validation-fnv-1a-128 = ["neocogi-com/com-validation-fnv-1a-128", "neocogi-com-runtime/com-validation-fnv-1a-128", "neocogi-ui-runtime/com-validation-fnv-1a-128", "neocogi-render-plugin/com-validation-fnv-1a-128", "neocogi-assets/com-validation-fnv-1a-128"]
com-validation-mangling = ["neocogi-com/com-validation-mangling", "neocogi-com-runtime/com-validation-mangling", "neocogi-ui-runtime/com-validation-mangling", "neocogi-render-plugin/com-validation-mangling", "neocogi-assets/com-validation-mangling"]
# Link the runtime and all three implementation descriptors into one executable.
monolith = ["neocogi-demo-host/monolith"]
glow = ["neocogi-demo-host/glow", "neocogi-render-plugin/glow"]
webgl = ["neocogi-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-demo-assets/embed-assets"]
vulkan = ["neocogi-demo-host/vulkan", "neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-demo-host/wgpu", "neocogi-render-plugin/wgpu"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["std", "macros"] }
neocogi-demo-contracts.workspace = true
neocogi-demo-assets = { workspace = true, features = ["full-demo"] }
neocogi-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Dynamic assembly roots add `dynamic-plugin`; monoliths call descriptors directly.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime" }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "a61f7aaa03f47402b13b8ac538fe390f6fe1866b", default-features = false }
neocogi-assets = { workspace = true, features = ["theme-json"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
