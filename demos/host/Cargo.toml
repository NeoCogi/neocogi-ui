[package]
name = "neocogi-demo-host"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Cargo builds these DLLs; no Rust implementation is linked into a dynamic host.
dynamic = ["dep:neocogi-demo-plugins"]
dynamic-skin = ["dynamic", "neocogi-demo-plugins/skin"]
dynamic-extension = ["dynamic", "neocogi-demo-plugins/extension"]
monolith-extension = ["monolith", "dep:neocogi-example-ui-extension"]
# Native selection belongs to the separately built renderer plugin.
glow = ["neocogi-render-plugin?/glow", "neocogi-demo-plugins?/glow"]
vulkan = ["neocogi-render-plugin?/vulkan", "neocogi-demo-plugins?/vulkan"]
wgpu = ["neocogi-render-plugin?/wgpu", "neocogi-demo-plugins?/wgpu"]
webgl = ["dep:neocogi-ui-runtime", "dep:neocogi-ui-nodes", "dep:neocogi-render-plugin", "dep:neocogi-gfx", "neocogi-render-plugin/webgl"]
# Expose PNG upload through the GFX plugin selected by the owning application.
png-assets = []
# Link/register live appearance compilation without the native JSON theme loader.
skin = ["dep:neocogi-skin"]
# Native monoliths retain only the implementations selected by their assembly.
monolith = ["neocogi-com/static-runtime", "dep:neocogi-ui-runtime", "dep:neocogi-ui-nodes", "dep:neocogi-render-plugin"]
monolith-gfx = ["monolith", "dep:neocogi-gfx", "neocogi-gfx/builder"]
monolith-skin = ["monolith", "skin", "neocogi-skin/theme-json"]

[dependencies]
neocogi-demo-assets.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-ui-runtime = { path = "../../crates/ui/runtime", optional = true }
neocogi-ui-nodes = { workspace = true, optional = true }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "f6812ee0afc51c306a0ea4d2914da17d90e72ca3", optional = true, default-features = false }
neocogi-gfx = { workspace = true, optional = true, default-features = false }
neocogi-skin = { workspace = true, optional = true, default-features = false }
neocogi-example-ui-extension = { path = "../../examples/ui-extension", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-demo-plugins = { path = "../plugins", optional = true }
neocogi-com = { workspace = true, features = ["runtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
neocogi-com = { workspace = true, features = ["static-runtime"] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance", "Location", "UrlSearchParams", "console"] }
