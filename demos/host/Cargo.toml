[package]
name = "neocogi-demo-host"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Native selection belongs to the separately built renderer plugin.
glow = ["neocogi-render-plugin?/glow"]
vulkan = ["neocogi-render-plugin?/vulkan"]
wgpu = ["neocogi-render-plugin?/wgpu"]
webgl = ["dep:neocogi-ui-runtime", "dep:neocogi-render-plugin", "neocogi-render-plugin/webgl"]
# Browser modules link the same optional decoder/style descriptor staged as a native asset plugin.
png-assets = ["dep:neocogi-assets"]
# Native monoliths retain each plugin through direct descriptor registration and
# select the in-process implementation behind the otherwise unchanged runtime ABI.
monolith = ["neocogi-com/static-runtime", "dep:neocogi-ui-runtime", "dep:neocogi-render-plugin", "dep:neocogi-assets"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-ui-runtime = { path = "../../crates/ui/runtime", optional = true }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "da162fab5d29da4ac5cc5416a8e9194190f870f2", optional = true, default-features = false }
neocogi-assets = { path = "../../crates/assets", optional = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
neocogi-com = { workspace = true, features = ["static-runtime"] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance", "Location", "UrlSearchParams", "console"] }
