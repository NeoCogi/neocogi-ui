[package]
name = "neocogi-demo-host"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Native selection belongs to the separately built renderer plugin.
glow = ["neocogi-render-plugin?/glow"]
vulkan = ["neocogi-render-plugin?/vulkan"]
wgpu = ["neocogi-render-plugin?/wgpu"]
webgl = ["dep:neocogi-ui-runtime", "dep:neocogi-render-plugin", "dep:neocogi-gfx", "neocogi-render-plugin/webgl"]
# Expose PNG upload through the GFX plugin selected by the owning application.
png-assets = []
# Native monoliths retain only the implementations selected by their assembly.
monolith = ["neocogi-com/static-runtime", "dep:neocogi-ui-runtime", "dep:neocogi-render-plugin"]
monolith-gfx = ["monolith", "dep:neocogi-gfx"]
monolith-skin = ["monolith", "dep:neocogi-skin"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-ui-runtime = { path = "../../crates/ui/runtime", optional = true }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "9474691cbb4fbe94b5b5c2af302cfeeb5e767533", optional = true, default-features = false }
neocogi-gfx = { workspace = true, optional = true, default-features = false }
neocogi-skin = { workspace = true, optional = true, default-features = false, features = ["theme-json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
neocogi-com = { workspace = true, features = ["static-runtime"] }
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Performance", "Location", "UrlSearchParams", "console"] }
