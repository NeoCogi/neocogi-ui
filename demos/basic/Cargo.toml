[package]
name = "microui-redux-basic-demos"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wgpu"]
glow = ["microui-redux-demo-host/glow"]
webgl = ["microui-redux-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["microui-redux-demo-assets/embed-assets"]
vulkan = ["microui-redux-demo-host/vulkan"]
wgpu = ["microui-redux-demo-host/wgpu"]

[dependencies]
microui-redux.workspace = true
nc-com = { workspace = true, features = ["std", "macros"] }
microui-redux-demo-assets.workspace = true
microui-redux-demo-host.workspace = true
rs-math3d.workspace = true

[[bin]]
name = "backend-frame-cube"
path = "src/bin/backend-frame-cube.rs"
