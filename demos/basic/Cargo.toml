[package]
name = "neocogi-ui-basic-demos"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wgpu"]
glow = ["neocogi-ui-demo-host/glow", "microui-plugin-platform/glow"]
webgl = ["neocogi-ui-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-ui-demo-assets/embed-assets"]
vulkan = ["neocogi-ui-demo-host/vulkan", "microui-plugin-platform/vulkan"]
wgpu = ["neocogi-ui-demo-host/wgpu", "microui-plugin-platform/wgpu"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-ui-demo-assets.workspace = true
neocogi-ui-demo-host.workspace = true
rs-math3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Build the shared artifacts as dependencies; native startup still loads their C ABI.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime", features = ["dynamic-plugin"] }
microui-plugin-platform = { path = "../../plugins/platform", default-features = false, features = ["dynamic-plugin"] }
microui-plugin-assets = { workspace = true, features = ["dynamic-plugin", "theme-json"] }

[[bin]]
name = "backend-frame-cube"
path = "src/bin/backend-frame-cube.rs"
