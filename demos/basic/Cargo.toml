[package]
# Installed executable names are declared explicitly below.
autobins = false
name = "neocogi-demo-basic"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
dynamic = ["neocogi-demo-host/dynamic"]
default = ["glow", "dynamic"]
# Link only the runtime, UI, renderer, and required GFX builder into one executable.
monolith = ["neocogi-demo-host/monolith-gfx"]
glow = ["neocogi-demo-host/glow"]
webgl = ["neocogi-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-demo-assets/embed-assets"]
vulkan = ["neocogi-demo-host/vulkan"]
wgpu = ["neocogi-demo-host/wgpu"]

[dependencies]
neocogi-com-runtime.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["std", "macros"] }
neocogi-demo-assets.workspace = true
neocogi-demo-host.workspace = true
rs-math3d.workspace = true


[[bin]]
name = "neocogi-demo-cube"
path = "src/bin/backend-frame-cube.rs"

[[bin]]
name = "neocogi-demo-simple"
path = "src/bin/simple.rs"

[[bin]]
name = "neocogi-demo-calculator"
path = "src/bin/calculator.rs"
