[package]
name = "neocogi-demo-smoke"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["glow"]
com-validation-none = ["neocogi-com/com-validation-none", "neocogi-com-runtime/com-validation-none", "neocogi-ui-runtime/com-validation-none", "neocogi-render-plugin/com-validation-none", "neocogi-assets/com-validation-none", "neocogi-example-ui-extension?/com-validation-none"]
com-validation-sha-256 = ["neocogi-com/com-validation-sha-256", "neocogi-com-runtime/com-validation-sha-256", "neocogi-ui-runtime/com-validation-sha-256", "neocogi-render-plugin/com-validation-sha-256", "neocogi-assets/com-validation-sha-256", "neocogi-example-ui-extension?/com-validation-sha-256"]
com-validation-fnv-1a-128 = ["neocogi-com/com-validation-fnv-1a-128", "neocogi-com-runtime/com-validation-fnv-1a-128", "neocogi-ui-runtime/com-validation-fnv-1a-128", "neocogi-render-plugin/com-validation-fnv-1a-128", "neocogi-assets/com-validation-fnv-1a-128", "neocogi-example-ui-extension?/com-validation-fnv-1a-128"]
com-validation-mangling = ["neocogi-com/com-validation-mangling", "neocogi-com-runtime/com-validation-mangling", "neocogi-ui-runtime/com-validation-mangling", "neocogi-render-plugin/com-validation-mangling", "neocogi-assets/com-validation-mangling", "neocogi-example-ui-extension?/com-validation-mangling"]
glow = ["neocogi-render-plugin/glow"]
vulkan = ["neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-render-plugin/wgpu"]
extension = ["dep:neocogi-example-ui-extension"]
# Standalone development benchmark; no counters or recorder enter the normal demo executable.
benchmark = ["embed-assets"]
embed-assets = ["neocogi-demo-assets/embed-assets"]

[dependencies]
neocogi-demo-contracts.workspace = true
rs-math3d.workspace = true
neocogi-ui.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["runtime", "macros", "std"] }

neocogi-demo-assets.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Build the shared artifacts as dependencies; native startup still loads their C ABI.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime", features = ["dynamic-plugin"] }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "d5ed4e0dbd5ccc6783f062f2af1b8a631eb306fe", default-features = false, features = ["dynamic-plugin"] }
neocogi-assets = { workspace = true, features = ["dynamic-plugin", "theme-json"] }
neocogi-example-ui-extension = { path = "../../examples/ui-extension", optional = true, features = ["dynamic-plugin"] }

[[bin]]
name = "com-bench"
path = "src/bin/com-bench.rs"
required-features = ["benchmark"]
