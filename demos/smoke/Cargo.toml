[package]
name = "neocogi-demo-smoke"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["glow"]
# Link the runtime and selected implementation descriptors into one executable.
monolith = ["neocogi-com/static-runtime"]
glow = ["neocogi-render-plugin/glow"]
vulkan = ["neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-render-plugin/wgpu"]
extension = ["dep:neocogi-example-ui-extension"]
# Standalone development benchmark; no counters or recorder enter the normal demo executable.
benchmark = ["embed-assets"]
embed-assets = ["neocogi-demo-assets/embed-assets"]

[dependencies]
neocogi-demo-contracts.workspace = true
neocogi-demo-render-contracts.workspace = true
rs-math3d.workspace = true
neocogi-ui = { workspace = true, features = ["skin"] }
neocogi-com = { workspace = true, default-features = false, features = ["runtime", "macros", "std"] }

neocogi-demo-assets.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Dynamic assembly roots add `dynamic-plugin`; monoliths call descriptors directly.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime" }
neocogi-render-plugin = { git = "ssh://git@github.com/NeoCogi/neocogi-platform.git", rev = "06be77d4a262f9d62f23ae1d3ae92dfc8e3b8283", default-features = false }
neocogi-gfx = { workspace = true, features = ["builder"] }
neocogi-skin = { workspace = true, features = ["theme-json"] }
neocogi-example-ui-extension = { path = "../../examples/ui-extension", optional = true }

[[bin]]
name = "com-bench"
path = "src/bin/com-bench.rs"
required-features = ["benchmark"]
