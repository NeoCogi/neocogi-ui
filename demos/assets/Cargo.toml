[package]
name = "neocogi-demo-assets"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Additional themes, photo and mesh are exclusive to the full demo.
full-demo = []
# Explicit opt-in for self-contained resources, including browser deployments.
embed-assets = ["neocogi-gfx-support/compiled-assets", "dep:neocogi-assets", "dep:neocogi-gfx-contracts", "dep:neocogi-gfx-support"]

[dependencies]
neocogi-ui = { workspace = true, features = ["gfx", "skin"] }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-gfx-contracts = { workspace = true, optional = true }
neocogi-gfx-support = { workspace = true, optional = true }

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
# Resolve the host facade only when the asset generator actually runs.
neocogi-gfx-support = { workspace = true, optional = true }
neocogi-assets = { workspace = true, optional = true, features = ["builder", "save-to-rust", "theme-json"] }
