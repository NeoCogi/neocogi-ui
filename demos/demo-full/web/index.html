<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>microui-redux WebGL demo</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #202124;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ddd;
      font: 14px/1.4 system-ui, sans-serif;
      padding: 2rem;
      pointer-events: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="status">Loading microui-redux…</div>
  <script type="module">
    const status = document.getElementById("status");
    const showFailure = (message) => {
      const detail = message?.stack ?? message;
      status.textContent = `Demo failed: ${detail}`;
      if (!status.isConnected) {
        document.body.append(status);
      }
    };

    window.addEventListener("error", (event) => showFailure(event.error ?? event.message));
    window.addEventListener("unhandledrejection", (event) => showFailure(event.reason));
    try {
      const { default: init } = await import("./microui-redux-demo-full.js");
      await init();
      requestAnimationFrame(() => {
        document.querySelector("canvas")?.focus();
        status.remove();
      });
    } catch (error) {
      showFailure(error);
    }
  </script>
</body>
</html>
