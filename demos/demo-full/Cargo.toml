[package]
name = "neocogi-ui-demo-full"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["glow"]
glow = ["neocogi-ui-demo-host/glow", "neocogi-render-plugin/glow"]
webgl = ["neocogi-ui-demo-host/webgl", "embed-assets"]
# Native deployments read adjacent files unless this feature is explicitly requested.
embed-assets = ["neocogi-ui-demo-assets/embed-assets"]
vulkan = ["neocogi-ui-demo-host/vulkan", "neocogi-render-plugin/vulkan"]
wgpu = ["neocogi-ui-demo-host/wgpu", "neocogi-render-plugin/wgpu"]

[dependencies]
neocogi-ui.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
microui-demo-contracts.workspace = true
neocogi-ui-demo-assets = { workspace = true, features = ["full-demo"] }
neocogi-ui-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Build the shared artifacts as dependencies; native startup still loads their C ABI.
neocogi-com-runtime.workspace = true
neocogi-ui-runtime = { path = "../../crates/ui/runtime", features = ["dynamic-plugin"] }
neocogi-render-plugin = { path = "../../crates/render/plugin", default-features = false, features = ["dynamic-plugin"] }
microui-plugin-assets = { workspace = true, features = ["dynamic-plugin", "theme-json"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
