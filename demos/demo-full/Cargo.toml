[package]
name = "microui-redux-demo-full"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wgpu"]
glow = ["microui-redux-demo-host/glow"]
webgl = ["microui-redux-demo-host/webgl"]
vulkan = ["microui-redux-demo-host/vulkan"]
wgpu = ["microui-redux-demo-host/wgpu"]

[dependencies]
microui-redux.workspace = true
nc-com = { workspace = true, features = ["std", "macros"] }
microui-demo-contracts.workspace = true
microui-redux-demo-assets = { workspace = true, features = ["full-demo"] }
microui-redux-demo-host = { workspace = true, features = ["png-assets"] }
rs-math3d.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true
