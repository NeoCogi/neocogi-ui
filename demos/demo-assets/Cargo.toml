[package]
name = "microui-redux-demo-assets"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["builder"]
builder = ["microui-ui/builder"]
prebuilt-atlas = ["microui-ui/png_source"]

[dependencies]
microui-ui.workspace = true

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
microui-ui = { workspace = true, features = ["builder", "save-to-rust", "png_source"] }
