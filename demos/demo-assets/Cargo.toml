[package]
name = "microui-redux-demo-assets"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The recipe is exposed only to construction tools and asset-provider tests.
builder = ["dep:microui-ui", "microui-ui/builder"]
# Additional compiled choices and the sample photo are exclusive to the full demo.
full-demo = []

[dependencies]
microui-ui = { workspace = true, optional = true }
microui-redux = { workspace = true, features = ["compiled-assets"] }
nc-com.workspace = true

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
microui-ui = { workspace = true, features = ["builder", "save-to-rust", "png_source", "theme-json"] }
