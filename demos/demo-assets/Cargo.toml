[package]
name = "microui-redux-demo-assets"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["builder"]
builder = ["microui-redux/builder"]
prebuilt-atlas = ["microui-redux/png_source"]

[dependencies]
microui-redux.workspace = true

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
microui-redux = { workspace = true, features = ["builder", "save-to-rust", "png_source"] }
