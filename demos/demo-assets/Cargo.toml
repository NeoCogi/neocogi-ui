[package]
name = "microui-redux-demo-assets"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["builder"]
builder = ["dep:microui-ui", "microui-ui/builder"]
prebuilt-atlas = ["dep:microui-ui", "microui-ui/png_source"]
prebuilt-com = ["dep:microui-redux", "dep:nc-com"]

[dependencies]
microui-ui = { workspace = true, optional = true }
microui-redux = { workspace = true, optional = true }
nc-com = { workspace = true, optional = true }

# Cargo builds these APIs for the host even when the demo target is WebAssembly.
[build-dependencies]
microui-ui = { workspace = true, features = ["builder", "save-to-rust", "png_source"] }
